const NORMAL_FRUITS = FRUITS.filter(f => !f.special);
const randomFruit = () => NORMAL_FRUITS[Math.floor(Math.random() * NORMAL_FRUITS.length)];

// Formation throws: fruit come in a readable shape instead of at random
function schedulePattern() {
  const kind = ['line', 'arc', 'fountain'][Math.floor(Math.random() * 3)];
  const fruit = randomFruit(), mixed = Math.random() < 0.5;
  const pick = () => (mixed ? randomFruit() : fruit);
  let t = 0;
  if (kind === 'line') {        // a neat row across the screen, left to right
    const n = 5 + Math.floor(rand(0, 3)), peak = rand(viewH * 0.05, viewH / 2 - 2.5);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1) - 0.5) * viewW * 0.76;
      game.queue.push({ t: i * 0.09, kind: pick(), x0: x, xTarget: x, peak });
    }
    t = n * 0.09;
  } else if (kind === 'arc') {  // a stream thrown from one corner across to the other side
    const dir = Math.random() < 0.5 ? 1 : -1, n = 6;
    for (let i = 0; i < n; i++)
      game.queue.push({ t: i * 0.14, kind: pick(), x0: -dir * viewW * 0.45, xTarget: dir * viewW * rand(0.3, 0.45), peak: rand(viewH * 0.1, viewH / 2 - 2) });
    t = n * 0.14;
  } else {                      // a fountain: everything launched from the middle, fanning out
    const n = 6;
    for (let i = 0; i < n; i++)
      game.queue.push({ t: 0.02 * i, kind: pick(), x0: rand(-0.4, 0.4), xTarget: (i / (n - 1) - 0.5) * viewW * 0.7, peak: rand(viewH * 0.15, viewH / 2 - 1.5) });
    t = 0.2;
  }
  game.spawnTimer = 2.2 + t;
}

function scheduleWave() {
  const T = game.type, timed = MODES[T].time;
  const diff = Math.min(1, game.elapsed / (timed || 90));
  if (game.elapsed > 10 && Math.random() < 0.16) return schedulePattern();
  const count = 1 + Math.floor(Math.random() * (2 + diff * 4)) + (T === 'classic' ? 0 : 1);
  const bombChance = T === 'zen' ? 0 : T === 'arcade' ? 0.12 + diff * 0.1 : 0.1 + diff * 0.15;
  let bombs = 0;
  let delay = 0;
  for (let i = 0; i < count; i++) {
    const isBomb = Math.random() < bombChance && bombs < 1 + Math.floor(diff * 2);
    if (isBomb) bombs++;
    // Arcade bombs can be smoke or mirror bombs
    const variant = isBomb && T === 'arcade' ? [null, null, 'smoke', 'mirror'][Math.floor(Math.random() * 4)] : null;
    game.queue.push({ t: delay, kind: isBomb ? 'bomb' : randomFruit(), variant });
    delay += Math.random() < 0.5 ? 0 : rand(0.1, 0.35);
  }
  // Special fruit: a rare golden fruit, or a hard coconut
  if (game.elapsed > 5 && Math.random() < 0.08) game.queue.push({ t: delay + 0.15, kind: randomFruit(), golden: true });
  if (game.elapsed > 8 && Math.random() < 0.07) game.queue.push({ t: delay + 0.3, kind: FRUITS.find(f => f.id === 'coconut'), peak: rand(viewH * 0.15, viewH / 2 - 2) });
  // Arcade: sometimes one glowing power-up fruit joins the wave
  if (T === 'arcade' && Math.random() < 0.2) {
    const keys = Object.keys(POWERS);
    game.queue.push({ t: delay + 0.2, kind: randomFruit(), power: keys[Math.floor(Math.random() * keys.length)] });
  }
  game.spawnTimer = (T === 'classic' ? THREE.MathUtils.lerp(2.2, 1.1, diff) : THREE.MathUtils.lerp(1.7, 0.9, diff)) + rand(0, 0.6) + delay;
}

// ---------- Input & trail ----------
let pointerDown = false, last = null, swipeId = 0;
const trail = [];
// While a mirror bomb is active, swipes land on the opposite side of the screen
function pt(ev) { return { x: game.mirror > 0 ? W - ev.clientX : ev.clientX, y: ev.clientY, t: performance.now(), id: swipeId }; }
addEventListener('pointerdown', (ev) => {
  audio();
  if (shopOpen || progressOpen || game.paused) return;
  pointerDown = true; swipeId++;
  last = pt(ev); trail.push(last);
  swipeDist = 0; lastSwipeSound = 0;
});
// Swipe whoosh: once the stroke is fast and long enough, and again on long continuous strokes
let swipeDist = 0, lastSwipeSound = 0;
addEventListener('pointermove', (ev) => {
  if (!pointerDown) return;
  const evs = ev.getCoalescedEvents ? ev.getCoalescedEvents() : [ev];
  for (const ce of (evs.length ? evs : [ev])) {
    const p = pt(ce);
    const seg = Math.hypot(p.x - last.x, p.y - last.y), speed = seg / Math.max(1, p.t - last.t);
    if (speed > 0.6) swipeDist += seg;
    if (swipeDist > 90 && p.t - lastSwipeSound > 280) { sfx.swipe(); lastSwipeSound = p.t; swipeDist = 0; }
    trySlice(last.x, last.y, p.x, p.y);
    emitTrail(last, p);
    trail.push(p); last = p;
  }
});
const up = () => { pointerDown = false; last = null; };
addEventListener('pointerup', up);
addEventListener('pointercancel', up);
addEventListener('blur', up);

// ---------- Knife effects: per-knife blade ribbon, trail particles and slice flash ----------
const TRAIL_LIFE = 190;
// Ribbon look per knife: width, outer glow color, inner core color
const BLADE = {
  classic: { w: 9,  outer: 'rgba(170,225,255,.9)', core: '#ffffff', blur: 18 },
  bamboo:  { w: 10, outer: 'rgba(90,170,50,.9)',   core: '#eaffc8', blur: 12 },
  inferno: { w: 13, outer: 'rgba(255,70,0,.95)',   core: '#ffe08a', blur: 26 },
  pixel:   { w: 0 },                                // drawn as pixel blocks instead
  toxic:   { w: 11, outer: 'rgba(80,255,40,.9)',   core: '#eaffb0', blur: 22 },
  frost:   { w: 10, outer: 'rgba(0,190,255,.95)',  core: '#f4ffff', blur: 22 },
  royal:   { w: 11, outer: 'rgba(255,180,0,.95)',  core: '#fff6c8', blur: 22 },
  storm:   { w: 0 },                                // drawn as lightning bolts
  shadow:  { w: 13, outer: 'rgba(200,0,255,.95)',  core: '#14001e', blur: 26 },
  cloud:   { w: 20, outer: 'rgba(255,245,230,.75)', core: 'rgba(255,255,255,.9)', blur: 30 },
  prism:   { w: 11, outer: null,                   core: '#ffffff', blur: 22 },
};
const NEON = ['#ff3cc8', '#3cf0ff', '#ffe83c', '#7dff3c'];
// Particle recipes per knife. p = power (1 while swiping, ~3 on a slice impact)
const EMIT = {
  classic: (p) => ({ shape: 'spark', vx: rand(-80, 80) * p, vy: rand(-80, 80) * p, life: rand(0.15, 0.3), size: rand(1, 2.5), color: '#e6f6ff', add: true }),
  bamboo:  (p) => ({ shape: 'leaf', vx: rand(-70, 70) * p, vy: rand(-80, 20) * p, g: 260, drag: 0.6, life: rand(0.6, 1.1), size: rand(5, 9), vr: rand(-8, 8), color: ['#7cc24a', '#a8d860', '#5a9a30'][Math.floor(rand(0, 3))] }),
  inferno: (p) => ({ shape: 'flame', vx: rand(-30, 30) * p, vy: rand(-140, -50) * p, drag: 0.4, life: rand(0.3, 0.55), size: rand(6, 13) * Math.min(p, 1.6), add: true }),
  pixel:   (p) => ({ shape: 'square', vx: rand(-90, 90) * p, vy: rand(-90, 90) * p, g: 200, life: rand(0.3, 0.6), size: [4, 6, 8][Math.floor(rand(0, 3))], color: NEON[Math.floor(rand(0, 4))] }),
  toxic:   (p) => Math.random() < 0.75
    ? ({ shape: 'drop', vx: rand(-30, 30) * p, vy: rand(-20, 60) * p, g: 700, life: rand(0.5, 0.9), size: rand(2.5, 5), color: '#86ff3a', add: true })
    : ({ shape: 'ring', vx: rand(-20, 20), vy: rand(-60, -20), life: rand(0.5, 0.8), size: rand(3, 7), color: '#c8ff7a', add: true }),
  frost:   (p) => ({ shape: 'flake', vx: rand(-50, 50) * p, vy: rand(-30, 40) * p, g: 40, drag: 0.5, life: rand(0.6, 1.1), size: rand(3, 7), vr: rand(-4, 4), color: '#d8f8ff', add: true }),
  royal:   (p) => ({ shape: 'star', vx: rand(-50, 50) * p, vy: rand(-50, 50) * p, g: 60, drag: 0.4, life: rand(0.4, 0.9), size: rand(3, 8), color: Math.random() < 0.5 ? '#ffe680' : '#fff8d8', add: true }),
  storm:   (p) => ({ shape: 'spark', vx: rand(-260, 260) * p, vy: rand(-260, 260) * p, drag: 0.1, life: rand(0.08, 0.2), size: rand(1, 2.5), color: '#d0d8ff', add: true }),
  shadow:  (p) => Math.random() < 0.6
    ? ({ shape: 'puff', vx: rand(-25, 25) * p, vy: rand(-40, 0) * p, drag: 0.5, life: rand(0.5, 0.9), size: rand(8, 15), grow: 1.8, color: '20,0,32', alpha: 0.7 })
    : ({ shape: 'spark', vx: rand(-90, 90) * p, vy: rand(-90, 90) * p, life: rand(0.2, 0.4), size: rand(1.5, 3), color: '#e070ff', add: true }),
  cloud:   (p) => ({ shape: 'puff', vx: rand(-40, 40) * p, vy: rand(-30, 10) * p, drag: 0.4, life: rand(0.4, 0.8), size: rand(9, 17), grow: 1.5, color: '255,255,255', alpha: 0.55 }),
  prism:   (p) => ({ shape: 'star', vx: rand(-80, 80) * p, vy: rand(-80, 80) * p, g: 40, drag: 0.4, life: rand(0.4, 0.8), size: rand(3, 7), color: `hsl(${(performance.now() * 0.3 + rand(0, 120)) % 360},100%,65%)`, add: true }),
};
const tparts = [];
function emitAt(x, y, n, power) {
  const fn = EMIT[knife().id] || EMIT.classic;
  for (let i = 0; i < n && tparts.length < 700; i++) {
    const o = fn(power);
    tparts.push({ x, y, g: 0, drag: 1, vr: 0, rot: rand(0, Math.PI * 2), grow: 1, alpha: 1, ...o, max: o.life });
  }
}
// called for every swipe segment
function emitTrail(a, b) {
  const seg = Math.hypot(b.x - a.x, b.y - a.y);
  const n = Math.min(6, Math.floor(seg / 14) + (Math.random() < 0.5 ? 1 : 0));
  for (let i = 0; i < n; i++) { const t = Math.random(); emitAt(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 1, 1); }
}
// big knife-colored burst + a bright slash streak across the fruit
const slashes = [];
function knifeImpact(x, y, dx, dy, r) {
  emitAt(x, y, 26, 2.8);
  const kn = knife(), B = BLADE[kn.id] || BLADE.classic;
  slashes.push({ x, y, ang: Math.atan2(dy, dx), len: Math.max(60, r * 3.2), t: 0, life: 0.22,
    color: kn.rainbow ? null : (B.outer || kn.glow), core: kn.id === 'shadow' ? '#f0b0ff' : '#ffffff' });
}

function drawParticle(c, p, k) {
  const s = p.size * (p.grow === 1 ? 1 : 1 + (p.grow - 1) * (1 - k));
  c.globalCompositeOperation = p.add ? 'lighter' : 'source-over';
  switch (p.shape) {
    case 'spark':
      c.globalAlpha = k; c.fillStyle = p.color;
      c.beginPath(); c.arc(p.x, p.y, s, 0, Math.PI * 2); c.fill(); break;
    case 'flame': {
      const r = s * (0.6 + 0.8 * k);
      const gr = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      gr.addColorStop(0, `rgba(255,248,200,${k})`); gr.addColorStop(0.35, `rgba(255,150,20,${0.85 * k})`);
      gr.addColorStop(1, 'rgba(200,20,0,0)');
      c.globalAlpha = 1; c.fillStyle = gr; c.beginPath(); c.arc(p.x, p.y, r, 0, Math.PI * 2); c.fill(); break;
    }
    case 'drop': {
      c.globalAlpha = k; c.fillStyle = p.color;
      const a = Math.atan2(p.vy, p.vx), st = Math.min(3, 1 + Math.hypot(p.vx, p.vy) / 200);
      c.beginPath(); c.ellipse(p.x, p.y, s * st, s, a, 0, Math.PI * 2); c.fill(); break;
    }
    case 'ring':
      c.globalAlpha = k; c.strokeStyle = p.color; c.lineWidth = 1.5;
      c.beginPath(); c.arc(p.x, p.y, s * (1.5 - k * 0.5), 0, Math.PI * 2); c.stroke(); break;
    case 'flake':
      c.globalAlpha = k; c.strokeStyle = p.color; c.lineWidth = 1.4;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      for (let i = 0; i < 3; i++) { c.rotate(Math.PI / 3); c.beginPath(); c.moveTo(-s, 0); c.lineTo(s, 0); c.stroke(); }
      c.restore(); break;
    case 'star': {
      const tw = 0.6 + 0.4 * Math.sin(performance.now() * 0.03 + p.rot * 10);
      c.globalAlpha = k * tw; c.fillStyle = p.color;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.beginPath();
      for (let i = 0; i < 8; i++) { const rr = i % 2 ? s * 0.22 : s; const a = (i / 8) * Math.PI * 2; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      c.closePath(); c.fill(); c.restore(); break;
    }
    case 'puff': {
      const gr = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, s);
      gr.addColorStop(0, `rgba(${p.color},${p.alpha * k})`); gr.addColorStop(1, `rgba(${p.color},0)`);
      c.globalAlpha = 1; c.fillStyle = gr; c.beginPath(); c.arc(p.x, p.y, s, 0, Math.PI * 2); c.fill(); break;
    }
    case 'leaf':
      c.globalAlpha = Math.min(1, k * 2); c.fillStyle = p.color;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot);
      c.beginPath(); c.ellipse(0, 0, s, s * 0.38, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = 'rgba(30,60,10,.6)'; c.lineWidth = 1; c.beginPath(); c.moveTo(-s, 0); c.lineTo(s, 0); c.stroke();
      c.restore(); break;
    case 'square':
      c.globalAlpha = k > 0.3 ? 1 : k / 0.3; c.fillStyle = p.color;
      c.fillRect(Math.round(p.x / 4) * 4 - s / 2, Math.round(p.y / 4) * 4 - s / 2, s, s); break;
  }
}

// Tapered blade ribbon through the stroke points
function drawRibbon(c, pts, now, wMax, fill, glow, blur) {
  const n = pts.length; if (n < 2) return;
  const L = [], R = [];
  let headW = 0;
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b.x - a.x, dy = b.y - a.y; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const k = Math.max(0, 1 - (now - p.t) / TRAIL_LIFE);
    const w = wMax * k * Math.pow(i / (n - 1), 0.7);
    L.push([p.x - dy * w, p.y + dx * w]); R.push([p.x + dy * w, p.y - dx * w]);
    headW = w;
  }
  c.shadowColor = glow || 'transparent'; c.shadowBlur = glow ? blur : 0;
  c.fillStyle = fill;
  c.beginPath(); c.moveTo(L[0][0], L[0][1]);
  for (const q of L) c.lineTo(q[0], q[1]);
  for (let i = n - 1; i >= 0; i--) c.lineTo(R[i][0], R[i][1]);
  c.closePath(); c.fill();
  const h = pts[n - 1]; // rounded blade tip
  c.beginPath(); c.arc(h.x, h.y, headW, 0, Math.PI * 2); c.fill();
}

// Jagged lightning bolt (with a branch) through the stroke
function drawBolt(c, pts, now) {
  if (pts.length < 2) return;
  const age = (now - pts[pts.length - 1].t) / TRAIL_LIFE, k = Math.max(0, 1 - age);
  const path = [];
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], j = 10 * k * (i / pts.length);
    path.push([p.x + rand(-j, j), p.y + rand(-j, j)]);
  }
  c.lineJoin = 'miter'; c.lineCap = 'round';
  for (const [wd, col, bl] of [[7 * k + 2, 'rgba(110,130,255,.55)', 26], [2.5 * k + 1, '#f4f6ff', 10]]) {
    c.shadowColor = '#7c8cff'; c.shadowBlur = bl; c.strokeStyle = col; c.lineWidth = wd;
    c.beginPath(); path.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.stroke();
  }
  if (path.length > 4 && Math.random() < 0.7) { // flickering branch
    const s = path[Math.floor(rand(1, path.length - 2))];
    let [x, y] = s; const a = rand(0, Math.PI * 2);
    c.lineWidth = 1.5; c.strokeStyle = '#dfe4ff'; c.beginPath(); c.moveTo(x, y);
    for (let i = 0; i < 4; i++) { x += Math.cos(a + rand(-0.8, 0.8)) * 14; y += Math.sin(a + rand(-0.8, 0.8)) * 14; c.lineTo(x, y); }
    c.stroke();
  }
}

let lastTrailNow = performance.now();
function drawTrail(now) {
  const dt = Math.min(0.05, (now - lastTrailNow) / 1000); lastTrailNow = now;
  while (trail.length && now - trail[0].t > TRAIL_LIFE) trail.shift();
  const c = tctx;
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  const kn = knife(), B = BLADE[kn.id] || BLADE.classic;

  // split the trail into separate strokes
  const strokes = [];
  for (const p of trail) {
    const s = strokes[strokes.length - 1];
    if (s && s[0].id === p.id) s.push(p); else strokes.push([p]);
  }

  for (const pts of strokes) {
    if (kn.id === 'storm') drawBolt(c, pts, now);
    else if (kn.id === 'pixel') {
      c.shadowBlur = 0;
      pts.forEach((p, i) => {
        const k = Math.max(0, 1 - (now - p.t) / TRAIL_LIFE), s = Math.round((3 + 9 * k * (i / pts.length)) / 2) * 2;
        if (s < 2) return;
        c.fillStyle = NEON[(p.id + i) % 2];
        c.fillRect(Math.round(p.x / 4) * 4 - s / 2, Math.round(p.y / 4) * 4 - s / 2, s, s);
        c.fillStyle = '#fff'; c.fillRect(Math.round(p.x / 4) * 4 - s / 4, Math.round(p.y / 4) * 4 - s / 4, s / 2, s / 2);
      });
    } else {
      const glow = kn.rainbow ? `hsl(${(now * 0.3) % 360},100%,60%)` : B.outer;
      const outerFill = kn.rainbow ? (() => {
        const a = pts[0], b = pts[pts.length - 1], gr = c.createLinearGradient(a.x, a.y, b.x, b.y);
        for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, `hsl(${(now * 0.3 + i * 60) % 360},100%,62%)`);
        return gr;
      })() : B.outer;
      drawRibbon(c, pts, now, B.w, outerFill, glow, B.blur);
      drawRibbon(c, pts, now, B.w * 0.42, B.core, kn.id === 'shadow' ? 'rgba(255,120,255,.9)' : null, 8);
    }
  }
  c.shadowBlur = 0;

  // slash streaks on impact
  for (let i = slashes.length - 1; i >= 0; i--) {
    const s = slashes[i]; s.t += dt;
    const k = 1 - s.t / s.life;
    if (k <= 0) { slashes.splice(i, 1); continue; }
    c.save(); c.translate(s.x, s.y); c.rotate(s.ang);
    c.globalCompositeOperation = 'lighter';
    const L = s.len * (0.6 + 0.4 * (1 - k));
    const gr = c.createLinearGradient(-L, 0, L, 0);
    const col = s.color || `hsl(${(now * 0.5) % 360},100%,60%)`;
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.5, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
    c.globalAlpha = k; c.fillStyle = gr;
    c.beginPath(); c.ellipse(0, 0, L, 9 * k + 2, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = s.core; c.beginPath(); c.ellipse(0, 0, L * 0.8, 2 * k + 0.5, 0, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  // particles
  for (let i = tparts.length - 1; i >= 0; i--) {
    const p = tparts[i];
    p.life -= dt;
    if (p.life <= 0) { tparts.splice(i, 1); continue; }
    const drag = Math.pow(p.drag, dt);
    p.vx *= drag; p.vy = p.vy * drag + p.g * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    drawParticle(c, p, p.life / p.max);
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
}

function drawSplats(dt) {
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, W, H);
  for (let i = splats.length - 1; i >= 0; i--) {
    const s = splats[i]; s.t += dt;
    const alpha = Math.max(0, 0.7 * (1 - s.t / s.life));
    if (alpha <= 0) { splats.splice(i, 1); continue; }
    if (s.scorch) {
      const g = sctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.scorch);
      g.addColorStop(0, 'rgba(10,5,2,.95)'); g.addColorStop(0.5, 'rgba(25,12,5,.7)'); g.addColorStop(1, 'rgba(25,12,5,0)');
      sctx.globalAlpha = Math.min(1, alpha * 1.4); sctx.fillStyle = g;
      sctx.beginPath(); sctx.arc(s.x, s.y, s.scorch, 0, Math.PI * 2); sctx.fill();
      continue;
    }
    // juice stain: fully visible, then fades over the last 1.5 s
    sctx.globalAlpha = Math.min(1, (s.life - s.t) / 1.5) * 0.9;
    sctx.drawImage(s.img, s.x - s.S / 2, s.y - s.S / 2, s.S, s.S);
    sctx.lineCap = 'round';
    for (const d of s.drips) {
      const len = d.max * (1 - Math.exp(-s.t * 0.8)); // runs fast, then slows down
      const x0 = s.x + d.x, y0 = s.y + d.y;
      sctx.strokeStyle = rgbaHex(s.hex, 0.75); sctx.lineWidth = d.w;
      sctx.beginPath(); sctx.moveTo(x0, y0); sctx.lineTo(x0, y0 + len); sctx.stroke();
      sctx.fillStyle = rgbaHex(s.hex, 0.85);
      sctx.beginPath(); sctx.arc(x0, y0 + len, d.w * 0.85, 0, Math.PI * 2); sctx.fill();
    }
  }
  sctx.globalAlpha = 1;
}

// ---------- Main loop ----------
const clock = new THREE.Clock();
const labelV = new THREE.Vector3();
function frame() {
  const rawDt = Math.min(clock.getDelta(), 0.05);
  const dt = game.paused ? 0 : rawDt; // paused: the whole world freezes
  const now = performance.now();
  const t = clock.elapsedTime;

  if (game.mode === 'play') {
    game.elapsed += dt;
    if (scoring()) save.stats.playTime += dt;
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) scheduleWave();
    for (let i = game.queue.length - 1; i >= 0; i--) {
      const q = game.queue[i]; q.t -= dt;
      if (q.t <= 0) { spawnEntity(q.kind, q); game.queue.splice(i, 1); } // q carries power/variant/golden/launch overrides
    }

    // Power-ups (Arcade) and bomb handicaps
    for (const k of [...Object.keys(POWERS), 'smoke', 'mirror']) if (game[k] > 0) game[k] = Math.max(0, game[k] - dt);
    if (game.frenzy > 0) { // a rapid stream of fruit, no bombs
      game.frenzyTimer -= dt;
      if (game.frenzyTimer <= 0) { spawnEntity(randomFruit()); game.frenzyTimer = 0.13; }
    }
    updatePowers();

    // Countdown (Zen / Arcade)
    if (MODES[game.type].time) {
      game.timeLeft -= dt;
      const sec = Math.ceil(game.timeLeft);
      if (sec !== game.lastTick) {
        game.lastTick = sec; updateTimer();
        if (sec <= 5 && sec > 0) play(sec % 2 ? 'tick' : 'tock');
      }
      if (game.timeLeft <= 0) {
        game.timeLeft = 0; updateTimer();
        play('timeUp');
        popup("TIME'S UP!", W / 2, H * 0.4, 'combo');
        game.mode = 'dying'; game.freeze = game.frenzy = 0; updatePowers();
        setTimeout(gameOver, 1500);
      }
    }

    if (game.streakT > 0 && (game.streakT -= dt) <= 0) { game.streak = 0; updateHud(); }
    updateStreakHud();

    const c = game.combo;
    if (c.count > 0 && game.elapsed - c.last > 0.3) {
      if (c.count >= 3) {
        const bonus = addPoints(c.count);
        popup(`${c.count} Fruit Combo!${bonus ? ' +' + bonus : ''}`, c.x, c.y, 'combo');
        sfx.combo(c.count);
        buzz(30);
        track('combo', c.count);
        // chained combos build a streak multiplier that drains if you stop comboing
        if (scoring()) {
          game.streak = Math.min(4, (game.streak || 0) + 1);
          game.streakT = STREAK_TIME;
          if (game.streak > 0) setTimeout(() => popup(`STREAK ×${1 + game.streak}`, c.x, c.y + 50, 'streak'), 250);
        }
        updateHud();
      }
      c.count = 0;
    }
  }

  // Slow motion after a bomb blast: world objects slow down, the blast itself runs in real time
  let ts = 1;
  if (game.slowmo > 0) {
    game.slowmo -= dt;
    ts = game.slowmo > 0.35 ? 0.2 : THREE.MathUtils.lerp(1, 0.2, Math.max(0, game.slowmo) / 0.35);
  }
  if (game.freeze > 0) ts *= 0.35; // Freeze power-up slows the world
  const wdt = dt * ts;

  updateMenuItems(dt, t);
  for (const e of [...entities]) {
    const m = e.mesh;
    if (e.item) continue; // menu items are animated by updateMenuItems
    if (e.halo) e.halo.material.opacity = 0.65 + 0.35 * Math.sin(t * 8);
    e.vel.y -= G * wdt;
    m.position.addScaledVector(e.vel, wdt);
    m.rotation.x += e.spin.x * wdt; m.rotation.y += e.spin.y * wdt; m.rotation.z += e.spin.z * wdt;
    if (e.bomb) {
      const sp = m.userData.spark;
      sp.scale.setScalar(0.6 + Math.random() * 0.5);
      sp.material.rotation = Math.random() * Math.PI;
    }
    if (m.position.y < -viewH / 2 - 2.5 && e.vel.y < 0) {
      removeEntity(e);
      if (!e.bomb && !e.noMiss && game.mode === 'play' && game.type === 'classic') miss(e);
    }
  }

  for (let i = halves.length - 1; i >= 0; i--) {
    const h = halves[i];
    h.vel.y -= G * wdt;
    h.m.position.addScaledVector(h.vel, wdt);
    h.m.rotateOnWorldAxis(h.axis, h.spinSpeed * wdt);
    h.age = (h.age || 0) + wdt;
    // halves keep dripping juice while they fall
    if (h.drips > 0 && (h.dripT -= wdt) <= 0) {
      h.drips--; h.dripT = rand(0.04, 0.11);
      const m = new THREE.Mesh(dropGeo, juiceMat(h.juice));
      m.position.copy(h.m.position).addScaledVector(randDir(), 0.3 * h.scale);
      addPart(m, h.vel.clone().multiplyScalar(0.35).add(new THREE.Vector3(rand(-0.5, 0.5), -1, 0)), 0.9, rand(0.03, 0.06) * h.scale, 'drop');
    }
    if (h.m.position.y < -viewH / 2 - 3) { scene.remove(h.m); halves.splice(i, 1); }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= wdt;
    if (p.life <= 0) { scene.remove(p.m); particles.splice(i, 1); continue; }
    p.vel.y -= G * 0.7 * wdt;
    p.m.position.addScaledVector(p.vel, wdt);
    const k = p.life / p.max;
    if (p.type === 'drop') {
      // a big drop that reached the camera splats on the screen
      if (p.hit && p.m.position.z > 12) {
        const sp = toScreen(p.m.position);
        if (sp.x > 0 && sp.x < W && sp.y > 0 && sp.y < H) addSplat(sp.x, sp.y, p.hit.juice, rand(7, 15), p.vel.x, -p.vel.y, p.hit, true);
        scene.remove(p.m); particles.splice(i, 1); continue;
      }
      // stretch the droplet along its motion, like a real flying drop
      const speed = p.vel.length();
      p.m.quaternion.setFromUnitVectors(UP, tmpDir.copy(p.vel).divideScalar(speed || 1));
      const sz = p.s * Math.min(1, k * 2);
      p.m.scale.set(sz, sz * (1 + Math.min(2.5, speed * 0.12)), sz);
    } else if (p.type === 'chunk') {
      p.m.rotation.x += p.spin.x * wdt; p.m.rotation.y += p.spin.y * wdt; p.m.rotation.z += p.spin.z * wdt;
      p.m.scale.setScalar(p.s * Math.min(1, k * 3));
    } else {
      p.m.scale.setScalar(p.s * k);
    }
  }

  updateFx(dt);
  updateFuse();
  updateMenuMusic();

  if (game.shake > 0) {
    game.shake = Math.max(0, game.shake - dt * 1.6);
    const s = game.shake * game.shake;
    camera.position.x = rand(-1, 1) * s;
    camera.position.y = rand(-1, 1) * s;
    camera.rotation.z = rand(-1, 1) * s * 0.03;
  } else { camera.position.set(0, 0, 22); camera.rotation.z = 0; }

  drawSplats(dt);
  drawTrail(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- PWA: offline cache + "Install app" ----------
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
var installPrompt = null; // set when the browser offers installation
addEventListener('beforeinstallprompt', (ev) => {
  ev.preventDefault(); installPrompt = ev;
  if (screen === 'options') goScreen('options', 0); // show the Install item right away
});
addEventListener('appinstalled', () => { installPrompt = null; });
async function installApp() {
  if (!installPrompt) return;
  const p = installPrompt; installPrompt = null;
  try { await p.prompt(); await p.userChoice; } catch (e) {}
  if (screen === 'options') goScreen('options', 0);
}

updateHud();
goScreen('main', 150);
frame();
</script>
