<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fruit Slash 3D</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3a2414">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #3a2414;
    font-family: "Segoe UI", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none; cursor: crosshair;
  }
  #bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%),
      repeating-linear-gradient(90deg,
        #6b4226 0px, #7a4b2a 40px, #6e4427 80px, #5e381f 118px, #2e1a0c 120px);
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---- Menu: logo, wooden sign, screen heading ---- */
  #title {
    position: fixed; left: 50%; top: 3vh; transform: translateX(-50%) rotate(-3deg);
    font: 900 clamp(46px, 10vw, 104px)/1 "Segoe UI Black", "Arial Black", Impact, sans-serif;
    letter-spacing: 3px; white-space: nowrap; pointer-events: none;
    filter: drop-shadow(0 7px 0 rgba(0,0,0,.45));
    transition: opacity .3s, transform .3s;
  }
  #title span { -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 3px #3a1404; padding: 0 4px; }
  #title .f { background-image: linear-gradient(#fff3a0 0%, #ffb11a 40%, #ff5a1f 70%, #c9200f 100%); }
  #title .s {
    background-image: linear-gradient(#ffffff 0%, #d6dde4 45%, #7c8894 55%, #c5cdd5 100%);
    -webkit-text-stroke-color: #141a20; font-style: italic; position: relative;
  }
  #title .s::after { /* blade slash through the word */
    content: ""; position: absolute; left: -6%; right: -6%; top: 48%; height: 5px;
    background: linear-gradient(90deg, transparent, #fff 30%, #fff 70%, transparent);
    transform: rotate(-8deg); box-shadow: 0 0 12px #bfe6ff;
  }
  #title.hidden { display: block !important; opacity: 0; transform: translateX(-50%) translateY(-30px) rotate(-3deg); }
  #heading {
    position: fixed; left: 50%; top: 4vh; transform: translateX(-50%) rotate(-2deg);
    font: 900 clamp(34px, 7vw, 64px)/1 "Segoe UI Black", "Arial Black", Impact, sans-serif;
    color: #ffe27a; -webkit-text-stroke: 2px #3a1404; letter-spacing: 3px;
    text-shadow: 0 6px 0 rgba(0,0,0,.45); pointer-events: none; white-space: nowrap;
  }
  .sign {
    position: fixed; pointer-events: none; text-align: center;
    padding: 14px 24px; min-width: 150px; max-width: 44vw;
    font: 800 clamp(14px, 2.4vw, 21px)/1.35 "Segoe UI", system-ui, sans-serif; color: #4a2a0e;
    background:
      repeating-linear-gradient(0deg, rgba(120,70,20,.08) 0 2px, transparent 2px 9px),
      linear-gradient(#f1d7a2, #d4a964);
    border: 4px solid #6e3f17; border-radius: 6px;
    box-shadow: inset 0 0 0 2px rgba(255,240,200,.5), 0 7px 0 rgba(0,0,0,.35);
    transition: opacity .25s;
  }
  .sign b { font-size: 1.15em; color: #7a2a08; }
  .sign::before, .sign::after { /* nails */
    content: ""; position: absolute; top: 6px; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ddd, #555); box-shadow: 0 1px 1px rgba(0,0,0,.5);
  }
  .sign::before { left: 7px; } .sign::after { right: 7px; }
  .sign.main { left: 4vw; top: 30vh; transform: rotate(-5deg); }
  .sign.modes { left: 4vw; bottom: 7vh; transform: rotate(3deg); }
  .sign.options { left: 50%; bottom: 7vh; transform: translateX(-50%) rotate(-2deg); }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.5);
  }
  #score { font-size: 48px; font-weight: 800; line-height: 1; color: #ffd23f; }
  #best { font-size: 16px; opacity: .85; margin-top: 4px; }
  #lives { display: flex; gap: 6px; font-size: 40px; font-weight: 900; }
  #lives span { color: rgba(255,255,255,.35); transition: transform .25s, color .25s; }
  #lives span.lost { color: #ff3b3b; transform: scale(1.25); }
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; padding-top: 12vh;
    pointer-events: none; color: #fff; text-align: center;
    text-shadow: 0 4px 0 rgba(0,0,0,.5);
  }
  .overlay h1 { font-size: clamp(40px, 9vw, 84px); margin: 0; color: #ffd23f; letter-spacing: 2px; }
  .overlay p { font-size: clamp(16px, 3.5vw, 22px); margin: 10px 16px; }
  #center { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); text-align: center; }
  #modeTag { font-size: 14px; letter-spacing: 3px; opacity: .85; font-weight: 700; }
  #timer { font-size: 42px; font-weight: 800; line-height: 1.1; }
  #timer.low { color: #ff4b4b; animation: pulse .5s infinite; }
  #powers { font-size: 16px; font-weight: 800; margin-top: 2px; }
  #powers .freeze { color: #7fd4ff; } #powers .frenzy { color: #ff6b6b; } #powers .x2 { color: #ffd23f; } #powers .mirror { color: #d08aff; }
  #freezeTint {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s;
    background: radial-gradient(ellipse at center, rgba(120,200,255,0) 45%, rgba(120,200,255,.45) 100%);
  }
  #freezeTint.on { opacity: 1; }
  #mirrorTint {
    position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s;
    background: radial-gradient(ellipse at center, rgba(160,60,255,0) 50%, rgba(160,60,255,.45) 100%);
  }
  #mirrorTint.on { opacity: 1; animation: pulse 0.8s infinite; }
  /* smoke bomb: drifting grey clouds over the play field (but under the HUD) */
  #smoke { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; overflow: hidden; }
  #smoke.on { opacity: 1; transition: opacity .25s; }
  #smoke i {
    position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%;
    background: radial-gradient(circle, rgba(105,108,114,.92) 0%, rgba(105,108,114,.7) 40%, rgba(105,108,114,0) 70%);
    animation: drift 6s ease-in-out infinite alternate;
  }
  #smoke i:nth-child(1) { left: -20vmax; top: -10vmax; }
  #smoke i:nth-child(2) { left: 30vmax; top: -25vmax; animation-delay: -1s; }
  #smoke i:nth-child(3) { right: -25vmax; top: 5vmax; animation-delay: -2s; }
  #smoke i:nth-child(4) { left: -10vmax; bottom: -30vmax; animation-delay: -3s; }
  #smoke i:nth-child(5) { left: 25vmax; bottom: -20vmax; animation-delay: -4s; }
  #smoke i:nth-child(6) { right: -15vmax; bottom: -35vmax; animation-delay: -5s; }
  @keyframes drift { to { transform: translate(8vmax, -5vmax) scale(1.15); } }
  .modeLabel {
    position: fixed; transform: translate(-50%, 0); text-align: center; pointer-events: none;
    color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.6); max-width: 30vw;
  }
  .modeLabel b { display: block; font-size: clamp(18px, 4vw, 28px); letter-spacing: 1px; }
  .modeLabel span { font-size: clamp(11px, 2.6vw, 14px); opacity: .85; }
  .overlay .hint { position: absolute; bottom: 4vh; left: 0; right: 0; font-size: clamp(16px, 3.5vw, 22px); animation: pulse 1.4s infinite; }
  .hidden { display: none !important; }
  @keyframes pulse { 50% { opacity: .4; } }
  .popup {
    position: fixed; pointer-events: none; font-weight: 900; color: #fff;
    transform: translate(-50%, -50%); white-space: nowrap;
    text-shadow: 0 3px 0 rgba(0,0,0,.6); animation: rise 1s ease-out forwards;
  }
  .popup.combo { font-size: 36px; color: #ffd23f; }
  .popup.piece { font-size: 20px; color: #fff6c8; }
  .popup.streak { font-size: 30px; color: #ff8a3d; }
  #streak { display: flex; align-items: center; gap: 8px; margin: 4px 0 2px; }
  #streak.hidden { display: none; }
  #streakX { font-size: 24px; color: #ff8a3d; }
  #streakBar { width: 110px; height: 7px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; }
  #streakBar i { display: block; height: 100%; background: linear-gradient(90deg, #ff5a1f, #ffd23f); }
  .popup.miss { font-size: 44px; color: #ff3b3b; }
  @keyframes rise {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.6); }
    15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(1); }
  }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #coins { font-size: 18px; margin-top: 6px; color: #ffe27a; font-weight: 700; }

  .btn {
    pointer-events: auto; cursor: pointer; border: none; border-radius: 12px;
    background: linear-gradient(#ffd23f, #f0a500); color: #3a2414;
    font: 800 18px "Segoe UI", system-ui, sans-serif; padding: 12px 22px;
    box-shadow: 0 4px 0 #9a6400, 0 6px 14px rgba(0,0,0,.4);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #9a6400; }
  .btn:disabled { background: #6b5a48; color: #b8a890; box-shadow: none; cursor: not-allowed; }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; }
  .btn.cant { background: #6b5a48; color: #b8a890; box-shadow: none; }
  #musicBtn { position: fixed; right: 16px; bottom: 16px; font-size: 22px; padding: 8px 12px; }
  #pauseBtn { position: fixed; right: 16px; top: 72px; font-size: 18px; padding: 8px 14px; letter-spacing: -2px; }
  #pauseMenu {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; padding: 16px; cursor: default;
  }
  .pause-panel { text-align: center; width: min(360px, 100%); }
  .pause-panel h2 { margin: 4px 0 16px; color: #ffd23f; font-size: 38px; letter-spacing: 4px; }
  .pause-panel .btn { display: block; width: 100%; margin: 10px 0; font-size: 20px; }
  .pause-panel p { margin: 12px 0 2px; font-size: 13px; opacity: .65; }

  #shop, #progress {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    display: flex; align-items: center; justify-content: center; padding: 16px; cursor: default;
  }
  .panel {
    background: #2a1a0e; border: 3px solid #ffd23f; border-radius: 16px;
    width: min(560px, 100%); max-height: 85vh; overflow: auto; touch-action: pan-y;
    color: #fff; padding: 16px; box-sizing: border-box;
  }
  .shop-head { display: flex; align-items: center; gap: 12px; }
  .shop-head h2 { margin: 0; flex: 1; color: #ffd23f; font-size: 26px; }
  .tabs { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .tab {
    flex: 1; border: none; border-radius: 10px; padding: 9px 10px; cursor: pointer;
    background: rgba(255,255,255,.08); color: #fff; font: 700 15px "Segoe UI", system-ui, sans-serif;
  }
  .tab.on { background: #ffd23f; color: #3a2414; }
  .boardThumb { width: 84px; height: 52px; border-radius: 8px; flex: none; background: #2a1a0e center / cover; box-shadow: inset 0 0 0 2px rgba(255,255,255,.15); }
  .badge { font-size: 22px; width: 44px; text-align: center; flex: none; }
  .knife.locked { opacity: .55; }
  .bar { height: 7px; border-radius: 4px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #4caf50, #b6ff5a); }
  .reward { font-weight: 800; color: #ffe27a; white-space: nowrap; }
  .statRow { display: flex; justify-content: space-between; padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .statRow b { color: #ffd23f; }
  #toasts { position: fixed; left: 50%; top: 90px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; z-index: 5; }
  .toast {
    background: linear-gradient(#f1d7a2, #d4a964); color: #4a2a0e; border: 3px solid #6e3f17; border-radius: 10px;
    padding: 8px 16px; font: 800 15px "Segoe UI", system-ui, sans-serif; box-shadow: 0 5px 0 rgba(0,0,0,.35);
    animation: toastIn 3.2s ease forwards; white-space: nowrap;
  }
  .toast small { display: block; font-weight: 600; opacity: .8; }
  @keyframes toastIn { 0% { opacity: 0; transform: translateY(-20px) scale(.9); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
  .shop-head .coins { font-weight: 800; color: #ffe27a; font-size: 18px; }
  .knife {
    display: flex; align-items: center; gap: 14px; padding: 12px;
    border-radius: 12px; background: rgba(255,255,255,.06); margin-top: 10px;
  }
  .knife.equipped { outline: 2px solid #ffd23f; background: rgba(255,210,63,.12); }
  .swatch { width: 84px; height: 10px; border-radius: 6px; flex: none; }
  .knife .info { flex: 1; min-width: 0; }
  .knife .name { font-weight: 800; font-size: 17px; }
  .knife .desc { font-size: 13px; opacity: .75; }
  .knife .btn { font-size: 15px; padding: 8px 14px; white-space: nowrap; }
</style>
<script>
  // Choose where Three.js comes from. Browsers block JS modules loaded from file://,
  // so a double-clicked index.html uses the CDN; served over http(s) (Live Server,
  // GitHub Pages, installed PWA) it uses the bundled copy in vendor/ and works offline.
  (function () {
    var local = location.protocol !== 'file:';
    var map = { imports: local
      ? { 'three': './vendor/three/three.module.js', 'three/addons/': './vendor/three/addons/' }
      : { 'three': 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
          'three/addons/': 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/' } };
    var s = document.createElement('script');
    s.type = 'importmap';
    s.textContent = JSON.stringify(map);
    document.currentScript.after(s);
  })();
</script>
</head>
<body>
<div id="bg"></div>
<canvas id="splat"></canvas>
<canvas id="gl"></canvas>
<canvas id="trail"></canvas>

<div id="freezeTint"></div>
<div id="mirrorTint"></div>
<div id="smoke"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div id="hud">
  <div>
    <div id="score">0</div>
    <div id="streak" class="hidden"><b id="streakX">×2</b><div id="streakBar"><i></i></div></div>
    <div id="best">Best: 0</div><div id="coins">🪙 0</div>
  </div>
  <div id="center"><div id="modeTag"></div><div id="timer" class="hidden"></div><div id="powers"></div></div>
  <div id="lives"><span>✕</span><span>✕</span><span>✕</span></div>
</div>

<div id="title"><span class="f">FRUIT</span><span class="s">SLASH</span></div>
<div id="heading" class="hidden"></div>

  <h1 id="overTitle">GAME OVER</h1>
  <p id="finalScore"></p>
</div>
<button id="musicBtn" class="btn ghost" title="Toggle sound">🔊</button>

<div id="shop" class="hidden">
  <div class="panel">
    <div class="shop-head">
      <h2>Shop</h2>
      <div class="coins">🪙 <span id="shopCoins">0</span></div>
      <button id="closeShop" class="btn ghost">✕</button>
    </div>
    <div class="tabs" id="shopTabs">
      <button class="tab on" data-tab="knives">🔪 Knives</button>
      <button class="tab" data-tab="boards">🪵 Boards</button>
    </div>
    <p id="shopHint" style="margin:8px 0 0;opacity:.75;font-size:14px">Every point you score becomes a coin. Each knife slashes in its own colors.</p>

</div>

<div id="progress" class="hidden">
  <div class="panel">
    <div class="shop-head">
      <h2>Progress</h2>

      <button id="closeProgress" class="btn ghost">✕</button>
    </div>
    <div class="tabs" id="progTabs">
      <button class="tab on" data-tab="missions">📜 Daily</button>
      <button class="tab" data-tab="achievements">🏆 Achievements</button>
      <button class="tab" data-tab="stats">📊 Stats</button>

    <div id="progList"></div>
  </div>
</div>
<div id="toasts"></div>

<button id="pauseBtn" class="btn ghost hidden" title="Pause (P / Esc)">❚❚</button>
<div id="pauseMenu" class="hidden">
  <div class="panel pause-panel">
    <h2>PAUSED</h2>
    <button id="resumeBtn" class="btn">▶ Resume</button>
    <button id="restartBtn" class="btn ghost">↻ Restart</button>
    <button id="quitBtn" class="btn ghost">Quit to Menu</button>
    <p>Press P or Esc to resume</p>
  </div>
</div>

<div id="flash"></div>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- Setup ----------
const glCanvas = document.getElementById('gl');
const trailCanvas = document.getElementById('trail');
const splatCanvas = document.getElementById('splat');
const tctx = trailCanvas.getContext('2d');
const sctx = splatCanvas.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
camera.position.set(0, 0, 22);

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
// Image-based lighting gives realistic reflections on waxy / wet surfaces
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x553322, 0.5));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.0);
sun.position.set(5, 10, 12);
scene.add(sun);
const rim = new THREE.DirectionalLight(0xffe0c0, 1.2);
rim.position.set(-6, 4, -8);
scene.add(rim);

let W = 0, H = 0, viewW = 0, viewH = 0, dpr = 1;
function resize() {
  W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio, 2);
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  viewH = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  viewW = viewH * camera.aspect;
  for (const c of [trailCanvas, splatCanvas]) { c.width = W * dpr; c.height = H * dpr; }
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const css = (hex) => '#' + hex.toString(16).padStart(6, '0');
const UP = new THREE.Vector3(0, 1, 0);

// ---------- Fruit definitions ----------
const FRUITS = [
  { id: 'watermelon', r: 1.3, juice: 0xff2a3a, flesh: 0xff4a55 },
  { id: 'orange', r: 0.9, juice: 0xffa020, flesh: 0xffb040 },
  { id: 'apple', r: 0.85, juice: 0xfff0b0, flesh: 0xfff2cc },
  { id: 'lemon', r: 0.72, juice: 0xffee55, flesh: 0xfff59a },
  { id: 'kiwi', r: 0.7, juice: 0x9be05a, flesh: 0x8fd14f },
  { id: 'plum', r: 0.75, juice: 0xc04080, flesh: 0xffcf5a },
  // special: a hard fruit that needs 3 hits (cracks first); never picked at random
  { id: 'coconut', r: 0.85, juice: 0xf1ecdc, flesh: 0xfbf8ee, special: true, hp: 3 },
];

// ---------- Procedural noise (value noise, seamless around the fruit) ----------
const NT = (() => {
  let a = 1337;
  const r = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const t = new Float32Array(65536); for (let i = 0; i < t.length; i++) t[i] = r(); return t;
})();
function vnoise(x, y, px) { // periodic in x with integer period px (<= 256)
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const x0 = ((xi % px) + px) % px, x1 = (x0 + 1) % px, y0 = (yi & 255) << 8, y1 = ((yi + 1) & 255) << 8;
  const a = NT[y0 | x0], b = NT[y0 | x1], c = NT[y1 | x0], d = NT[y1 | x1];
  return (a + (b - a) * u) * (1 - v) + (c + (d - c) * u) * v;
}
function fbm(u, v, fu, fv, oct = 4, seed = 0) {
  let s = 0, amp = 0.5, norm = 0;
  for (let i = 0; i < oct; i++) {
    s += amp * vnoise(u * fu, v * fv + seed * 31.7 + i * 7.1, fu);
    norm += amp; fu *= 2; fv *= 2; amp *= 0.5;
  }
  return s / norm;
}
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mixC = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// Paints a skin color map + derived normal map. fn(u, v) -> [r, g, b, height]
function paintSkin(w, h, normalStrength, fn) {
  const cc = document.createElement('canvas'); cc.width = w; cc.height = h;
  const img = cc.getContext('2d').createImageData(w, h);
  const hgt = new Float32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const o = fn(x / w, 1 - y / h), i = (y * w + x) * 4;
    img.data[i] = o[0]; img.data[i + 1] = o[1]; img.data[i + 2] = o[2]; img.data[i + 3] = 255;
    hgt[y * w + x] = o[3];
  }
  cc.getContext('2d').putImageData(img, 0, 0);
  const nc = document.createElement('canvas'); nc.width = w; nc.height = h;
  const nimg = nc.getContext('2d').createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const xl = (x - 1 + w) % w, xr = (x + 1) % w, yu = Math.max(0, y - 1), yd = Math.min(h - 1, y + 1);
    let nx = -(hgt[y * w + xr] - hgt[y * w + xl]) * normalStrength;
    let ny = (hgt[yd * w + x] - hgt[yu * w + x]) * normalStrength;
    const l = Math.hypot(nx, ny, 1), i = (y * w + x) * 4;
    nimg.data[i] = (nx / l * 0.5 + 0.5) * 255; nimg.data[i + 1] = (ny / l * 0.5 + 0.5) * 255;
    nimg.data[i + 2] = (1 / l * 0.5 + 0.5) * 255; nimg.data[i + 3] = 255;
  }
  nc.getContext('2d').putImageData(nimg, 0, 0);
  const map = new THREE.CanvasTexture(cc); map.colorSpace = THREE.SRGBColorSpace;
  const normalMap = new THREE.CanvasTexture(nc);
  for (const t of [map, normalMap]) { t.wrapS = THREE.RepeatWrapping; t.anisotropy = 4; }
  return { map, normalMap };
}

const SKINS = {
  watermelon: () => paintSkin(512, 256, 3, (u, v) => {
    const warp = fbm(u, v, 4, 3, 3, 1) - 0.5;
    let sp = u * 16 + warp * 1.3 + (fbm(u, v, 32, 12, 2, 2) - 0.5) * 0.6;
    sp = ((sp % 1) + 1) % 1;
    const stripe = 1 - ss(0.3, 0.55, Math.abs(sp - 0.5) * 2);
    const mott = fbm(u, v, 32, 16, 3, 3);
    let c = mixC([128, 172, 82], [24, 70, 30], stripe);
    c = c.map(x => x * (0.82 + 0.36 * mott));
    const spot = ss(0.32, 0.05, Math.hypot((u - 0.5) * 2.4, (v - 0.5) * 1.3) + (fbm(u, v, 8, 8, 2, 4) - 0.5) * 0.2);
    c = mixC(c, [214, 196, 118], spot * 0.85);
    const pole = ss(0.04, 0.0, Math.min(v, 1 - v));
    c = mixC(c, [120, 100, 50], pole);
    return [c[0], c[1], c[2], 0.5 + 0.5 * fbm(u, v, 64, 32, 2, 5)];
  }),
  orange: () => paintSkin(256, 256, 7, (u, v) => {
    const base = fbm(u, v, 4, 4, 3, 6);
    const pore = ss(0.55, 0.82, vnoise(u * 96, v * 96, 96));
    let c = mixC([255, 152, 28], [228, 108, 8], base).map(x => x * (1 - 0.16 * pore));
    c = mixC(c, [110, 105, 40], ss(0.965, 0.99, v));
    return [c[0], c[1], c[2], 1 - pore * 0.7 + 0.15 * vnoise(u * 128, v * 128 + 50, 128)];
  }),
  lemon: () => paintSkin(256, 256, 6, (u, v) => {
    const base = fbm(u, v, 4, 4, 3, 7);
    const pore = ss(0.58, 0.85, vnoise(u * 128, v * 128, 128));
    let c = mixC([252, 224, 58], [236, 196, 24], base).map(x => x * (1 - 0.12 * pore));
    c = mixC(c, [196, 200, 66], 0.55 * (ss(0.14, 0.02, v) + ss(0.86, 0.98, v)));
    return [c[0], c[1], c[2], 1 - pore * 0.6];
  }),
  apple: () => paintSkin(256, 256, 2, (u, v) => {
    const streak = fbm(u, v, 48, 3, 3, 8);
    const blush = ss(0.35, 0.68, fbm(u, v, 3, 2, 3, 9) * 0.75 + v * 0.45);
    let c = mixC([214, 196, 92], mixC([138, 10, 22], [210, 52, 38], streak), blush);
    const dot = ss(0.86, 0.95, vnoise(u * 160, v * 120, 160));
    c = mixC(c, [236, 212, 160], dot * 0.6);
    c = mixC(c, [150, 120, 55], 0.65 * (ss(0.9, 1, v) + ss(0.08, 0, v)));
    return [c[0], c[1], c[2], 0.5 + dot * 0.25 + 0.1 * streak];
  }),
  kiwi: () => paintSkin(256, 256, 5, (u, v) => {
    const n1 = fbm(u, v, 8, 8, 3, 10), fuzz = vnoise(u * 128, v * 128, 128);
    let c = mixC([92, 62, 32], [152, 112, 62], n1).map(x => x * (0.78 + 0.44 * fuzz));
    c = mixC(c, [60, 40, 20], ss(0.04, 0, Math.min(v, 1 - v)));
    return [c[0], c[1], c[2], fuzz * 0.8 + n1 * 0.2];
  }),
  coconut: () => paintSkin(256, 256, 6, (u, v) => {
    const fiber = fbm(u, v, 64, 4, 3, 13), blot = fbm(u, v, 6, 6, 3, 14);
    let c = mixC([62, 38, 20], [138, 96, 58], fiber * 0.7 + blot * 0.3);
    // the three "eyes" near the top
    for (const eu of [0.05, 0.38, 0.71]) {
      const du = Math.min(Math.abs(u - eu), 1 - Math.abs(u - eu));
      c = mixC(c, [30, 18, 10], ss(0.045, 0.015, Math.hypot(du * 2.2, (v - 0.9) * 1.6)));

  plum: () => paintSkin(256, 256, 2.5, (u, v) => {
    const n1 = fbm(u, v, 4, 4, 4, 11);

    c = mixC(c, [160, 110, 150], speck * 0.5);

  }),
};

const SKIN_MAT = {
  watermelon: { roughness: 0.35, clearcoat: 0.4, clearcoatRoughness: 0.3, normalScale: 0.6 },
  orange: { roughness: 0.55, clearcoat: 0.15, clearcoatRoughness: 0.5, normalScale: 1 },
  lemon: { roughness: 0.5, clearcoat: 0.2, clearcoatRoughness: 0.4, normalScale: 1 },
  apple: { roughness: 0.42, clearcoat: 0.8, clearcoatRoughness: 0.15, normalScale: 0.5 },
  kiwi: { roughness: 0.95, sheen: 1, sheenColor: 0xc8a070, sheenRoughness: 0.7, normalScale: 1 },
  plum: { roughness: 0.45, sheen: 0.8, sheenColor: 0x9a90c0, sheenRoughness: 0.5, clearcoat: 0.3, normalScale: 0.6 },
  coconut: { roughness: 0.95, sheen: 0.6, sheenColor: 0x8a6a48, sheenRoughness: 0.9, normalScale: 1.3 },

// Side profile of each fruit (bottom -> top), revolved with LatheGeometry
function fruitProfile(def) {
  const R = def.r, pts = [], N = 40;
  for (let i = 0; i <= N; i++) {
    const th = -Math.PI / 2 + Math.PI * i / N, s = Math.sin(th), c = Math.cos(th);
    const dimple = Math.exp(-((c / 0.3) ** 2));
    let r = c * R, y = s * R;
    switch (def.id) {
      case 'watermelon': y *= 1.25; break;
      case 'orange': y *= 0.94; if (s > 0) y -= 0.05 * R * dimple; break;
      case 'lemon': {
        const tip = Math.pow(Math.abs(s), 12);
        y = y * 1.25 + Math.sign(s) * R * 0.24 * tip;
        r *= (1 - 0.12 * Math.pow(Math.abs(s), 6)) * (1 - 0.5 * tip);
        break;
      }
      case 'apple':
        r *= 1 + 0.1 * s; y *= 0.92;
        y += s > 0 ? -0.3 * R * dimple : 0.15 * R * dimple;
        break;
      case 'kiwi': y *= 1.22; break;
      case 'plum': r *= 1 + 0.04 * s; y *= 1.05; if (s > 0) y -= 0.12 * R * dimple; break;
      case 'coconut': r *= 1 - 0.06 * s; y *= 1.1; break;
    }
    pts.push(new THREE.Vector2(i === 0 || i === N ? 0 : Math.max(0, r), y));
  }
  return pts;
}

// Paints the longitudinal cross-section (the juicy cut face), drawn in fruit units
function paintCap(def, pts, box) {
  const S = 512, R = def.r;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const sx = S / (box.maxX * 2), sy = S / (box.maxY - box.minY);
  g.setTransform(sx, 0, 0, -sy, box.maxX * sx, box.maxY * sy);
  const midY = (box.maxY + box.minY) / 2;
  const outline = (k) => {
    g.beginPath();
    pts.forEach((p, i) => { const x = p.x * k, y = midY + (p.y - midY) * k; i ? g.lineTo(x, y) : g.moveTo(x, y); });
    for (let i = pts.length - 2; i > 0; i--) g.lineTo(-pts[i].x * k, midY + (pts[i].y - midY) * k);
    g.closePath();
  };
  const fill = (k, style) => { outline(k); g.fillStyle = style; g.fill(); };
  const radial = (stops, rad) => {
    const gr = g.createRadialGradient(0, midY, 0, 0, midY, rad);
    stops.forEach(([o, col]) => gr.addColorStop(o, col)); return gr;
  };
  const ell = (x, y, rx, ry, rot, col) => { g.fillStyle = col; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); };
  const inside = (k) => { // random point inside the scaled outline (approx. ellipse)
    const a = rand(0, Math.PI * 2), d = Math.sqrt(Math.random());
    return [Math.cos(a) * d * box.maxX * k, midY + Math.sin(a) * d * (box.maxY - midY) * k];
  };
  const grains = (k, n, col, len) => {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) { const [x, y] = inside(k); g.beginPath(); g.ellipse(x, y, len * 0.35, len, rand(-0.4, 0.4), 0, Math.PI * 2); g.fill(); }
  };
  const meridians = (ks, col, w) => {
    g.strokeStyle = col; g.lineWidth = w;
    for (const k of ks) { g.beginPath(); pts.forEach((p, i) => { const x = p.x * k * 0.9, y = midY + (p.y - midY) * 0.9; i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); }
  };

  switch (def.id) {
    case 'watermelon': {
      fill(1, '#1d5521'); fill(0.968, '#a9d58a'); fill(0.94, '#eef6d6'); fill(0.905, '#f7b3a8');
      fill(0.885, radial([[0, '#d81e34'], [0.7, '#ec3346'], [1, '#f6707a']], box.maxY));
      grains(0.85, 900, 'rgba(255,190,190,.18)', 0.025 * R);
      for (let ring = 0; ring < 3; ring++) for (let i = 0; i < 9; i++) {
        const a = (i / 9) * Math.PI * 2 + ring * 0.35, d = 0.38 + ring * 0.12;
        const x = Math.cos(a) * box.maxX * d, y = midY + Math.sin(a) * (box.maxY - midY) * d;
        ell(x, y, 0.035 * R, 0.065 * R, a + Math.PI / 2, '#1a0e08');
        ell(x + 0.008 * R, y + 0.01 * R, 0.01 * R, 0.022 * R, a + Math.PI / 2, 'rgba(255,255,255,.35)');
      }
      break;
    }
    case 'orange': case 'lemon': {
      const O = def.id === 'orange';
      fill(1, O ? '#e8700c' : '#e8c51e'); fill(0.955, O ? '#fbe8c6' : '#fdf6da');
      fill(0.905, radial(O ? [[0, '#ffb33a'], [1, '#f58c12']] : [[0, '#fbf08a'], [1, '#f1dc4a']], box.maxY));
      grains(0.88, 1400, O ? 'rgba(255,214,140,.35)' : 'rgba(255,255,210,.4)', 0.03 * R);
      grains(0.88, 500, O ? 'rgba(220,110,10,.3)' : 'rgba(210,180,30,.3)', 0.03 * R);
      meridians([-0.72, -0.42, -0.14, 0.14, 0.42, 0.72], O ? 'rgba(255,240,205,.75)' : 'rgba(255,255,235,.8)', 0.018 * R);
      ell(0, midY, 0.05 * R, (box.maxY - midY) * 0.85, 0, O ? '#fff1d4' : '#fffbe6');
      break;
    }
    case 'apple': {
      fill(1, '#9c101a');
      fill(0.975, radial([[0, '#fcf3d6'], [0.75, '#f6ebc0'], [1, '#ece6a6']], box.maxY));
      grains(0.9, 500, 'rgba(255,255,240,.35)', 0.02 * R);
      g.strokeStyle = '#d6bf78'; g.lineWidth = 0.02 * R;
      g.beginPath(); g.moveTo(0, pts[pts.length - 1].y); g.lineTo(0, midY + 0.35 * R); g.stroke();
      g.beginPath(); g.moveTo(0, pts[0].y); g.lineTo(0, midY - 0.35 * R); g.stroke();
      g.fillStyle = 'rgba(225,200,130,.55)';
      g.beginPath(); g.ellipse(0, midY, 0.3 * R, 0.4 * R, 0, 0, Math.PI * 2); g.fill(); g.stroke();
      ell(0, midY, 0.12 * R, 0.24 * R, 0, '#f1e1a8');
      ell(-0.06 * R, midY + 0.02 * R, 0.045 * R, 0.1 * R, 0.25, '#5a3412');
      ell(0.06 * R, midY + 0.02 * R, 0.045 * R, 0.1 * R, -0.25, '#5a3412');
      break;
    }
    case 'kiwi': {
      fill(1, '#6b4a26');
      fill(0.96, radial([[0, '#d7ec90'], [0.35, '#9ccc48'], [1, '#5f9a2a']], box.maxY));
      g.strokeStyle = 'rgba(225,255,190,.28)'; g.lineWidth = 0.012 * R;
      for (let i = 0; i < 70; i++) {
        const a = (i / 70) * Math.PI * 2, ex = box.maxX * 0.9, ey = (box.maxY - midY) * 0.9;
        g.beginPath(); g.moveTo(Math.cos(a) * 0.14 * R, midY + Math.sin(a) * 0.7 * R);
        g.lineTo(Math.cos(a) * ex, midY + Math.sin(a) * ey); g.stroke();
      }
      ell(0, midY, 0.13 * R, 0.78 * R, 0, '#f2f5d8');
      for (let i = 0; i < 80; i++) {
        const a = (i / 80) * Math.PI * 2, d = rand(1.25, 1.6);
        ell(Math.cos(a) * 0.15 * R * d, midY + Math.sin(a) * 0.82 * R * Math.min(d, 1.2), 0.018 * R, 0.035 * R, -a + Math.PI / 2, '#120c06');
      }
      break;
    }
    case 'plum': {
      fill(1, '#3a0a33'); fill(0.975, '#b8283a');
      fill(0.95, radial([[0, '#ffd458'], [0.75, '#f6b03c'], [1, '#e8763a']], box.maxY));
      grains(0.9, 600, 'rgba(255,230,150,.3)', 0.025 * R);
      ell(0, midY, 0.34 * R, 0.5 * R, 0, '#ffe39a');
      ell(0, midY, 0.3 * R, 0.46 * R, 0, '#8a5a2a');
      g.strokeStyle = 'rgba(60,30,10,.5)'; g.lineWidth = 0.015 * R;
      for (let i = 0; i < 8; i++) { g.beginPath(); g.ellipse(0, midY, 0.3 * R * (i / 8), 0.46 * R, 0, 0, Math.PI * 2); g.stroke(); }
      break;
    }
    case 'coconut': {
      fill(1, '#5a3519'); fill(0.955, '#3a2210');                 // husk + hard shell
      fill(0.92, radial([[0, '#ffffff'], [1, '#f1ebda']], box.maxY)); // white meat
      fill(0.72, radial([[0, 'rgba(236,240,232,.9)'], [1, 'rgba(214,220,206,.95)']], box.maxY)); // coconut water
      grains(0.9, 500, 'rgba(255,255,255,.5)', 0.02 * R);
      g.fillStyle = 'rgba(255,255,255,.35)';
      g.beginPath(); g.ellipse(-0.15 * R, midY + 0.2 * R, 0.18 * R, 0.07 * R, -0.5, 0, Math.PI * 2); g.fill();
      break;
    }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return t;
}

// Cracked variants of a skin texture (for hard fruit hit before they split)
function crackedMaterial(def, stage) {
  const base = def.skinMat.map.image;
  const c = document.createElement('canvas'); c.width = base.width; c.height = base.height;
  const g = c.getContext('2d'); g.drawImage(base, 0, 0);
  const w = c.width, h = c.height;
  let a = 7 + stage * 31;
  const r = () => { a = (a * 9301 + 49297) % 233280; return a / 233280; }; // repeatable cracks
  for (let n = 0; n < stage * 3; n++) {
    let x = r() * w, y = h * (0.2 + r() * 0.6);
    const pts = [[x, y]];
    for (let i = 0; i < 9; i++) { x += (r() - 0.5) * 34; y += (r() - 0.3) * 22; pts.push([x, y]); }
    for (const [col, lw] of [['rgba(20,10,4,.95)', 4], ['rgba(240,225,200,.8)', 1.4]]) {
      g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
      pts.forEach(([px, py], i) => i ? g.lineTo(px, py) : g.moveTo(px, py)); g.stroke();
    }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping;
  const m = def.skinMat.clone(); m.map = t;
  return m;
}

// ---------- Fruit pieces: wedges of the lathe that can be cut again and again ----------
// A piece covers lathe angles [start, start+len]. A half is len = PI, a quarter PI/2, ...
// Each flat side of the wedge is half of the fruit's profile, showing the juicy flesh.
function halfCapShape(def) { // right half of the side profile, closed along the axis
  if (def.halfCapBase) return def.halfCapBase;
  const shape = new THREE.Shape();
  shape.moveTo(0, def.pts[0].y);
  for (const p of def.pts) shape.lineTo(p.x, p.y);
  shape.closePath();
  const geo = new THREE.ShapeGeometry(shape, 2);
  const pos = geo.attributes.position, uv = geo.attributes.uv, b = def.box;
  for (let i = 0; i < pos.count; i++)
    uv.setXY(i, (pos.getX(i) + b.maxX) / (b.maxX * 2), (pos.getY(i) - b.minY) / (b.maxY - b.minY));
  return (def.halfCapBase = geo);
}
function capAtAngle(def, phi) { // swing the half profile onto the plane at lathe angle phi
  const geo = halfCapShape(def).clone(), pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const sx = pos.getX(i);
    pos.setXYZ(i, sx * Math.sin(phi), pos.getY(i), sx * Math.cos(phi));
  }
  geo.computeVertexNormals();
  return geo;
}
function pieceGeos(def, start, len) {
  const key = start.toFixed(4) + ':' + len.toFixed(4);
  if (def.pieceCache.has(key)) return def.pieceCache.get(key);
  const seg = Math.max(4, Math.round(48 * len / (Math.PI * 2)));
  const skin = new THREE.LatheGeometry(def.pts, seg, start, len);
  const uv = skin.attributes.uv; // keep the skin texture where it was on the whole fruit
  for (let i = 0; i < uv.count; i++) uv.setX(i, (start + uv.getX(i) * len) / (Math.PI * 2));
  const g = { skin, capA: capAtAngle(def, start), capB: capAtAngle(def, start + len) };
  def.pieceCache.set(key, g);
  return g;
}
function makePiece(def, start, len, withStem) {
  const geos = pieceGeos(def, start, len), g = new THREE.Group();
  g.add(new THREE.Mesh(geos.skin, def.skinMat));
  g.add(new THREE.Mesh(geos.capA, def.capMat));
  g.add(new THREE.Mesh(geos.capB, def.capMat));
  if (withStem) addStem(def, g);
  return g;
}

for (const def of FRUITS) {
  const pts = fruitProfile(def);
  const box = { maxX: Math.max(...pts.map(p => p.x)), minY: pts[0].y, maxY: Math.max(...pts.map(p => p.y)) };
  def.topY = pts[pts.length - 1].y;
  def.extent = Math.max(box.maxX, box.maxY, -box.minY);
  const { map, normalMap } = SKINS[def.id]();
  const m = { ...SKIN_MAT[def.id] };
  const ns = m.normalScale; delete m.normalScale;
  def.skinMat = new THREE.MeshPhysicalMaterial({ map, normalMap, normalScale: new THREE.Vector2(ns, ns), ...m });
  def.capMat = new THREE.MeshPhysicalMaterial({ map: paintCap(def, pts, box), roughness: 0.4, clearcoat: 0.9, clearcoatRoughness: 0.2, side: THREE.DoubleSide });
  def.wholeGeo = new THREE.LatheGeometry(pts, 48);
  def.pts = pts; def.box = box; def.pieceCache = new Map();
}
for (const def of FRUITS) if (def.hp) def.crackMats = [null, crackedMaterial(def, 1), crackedMaterial(def, 2)];
// Golden fruit: a rare, shiny bonus fruit (+10)
const goldMat = new THREE.MeshPhysicalMaterial({ color: 0xffc23a, metalness: 1, roughness: 0.22, clearcoat: 1, clearcoatRoughness: 0.1 });

const stemMat = new THREE.MeshStandardMaterial({ color: 0x4a3018, roughness: 0.85 });
const leafMat = new THREE.MeshPhysicalMaterial({ color: 0x3d8b2f, roughness: 0.5, clearcoat: 0.4, side: THREE.DoubleSide });
const calyxMat = new THREE.MeshStandardMaterial({ color: 0x6b7a2a, roughness: 0.8 });
const leafShape = new THREE.Shape();
leafShape.moveTo(0, 0);
leafShape.bezierCurveTo(0.14, 0.08, 0.2, 0.26, 0, 0.46);
leafShape.bezierCurveTo(-0.2, 0.26, -0.14, 0.08, 0, 0);
const leafGeo = new THREE.ShapeGeometry(leafShape, 8);
const calyxGeo = new THREE.CylinderGeometry(0.06, 0.1, 0.05, 5);

function addStem(def, parent) {
  const top = def.topY;
  if (def.id === 'apple' || def.id === 'plum') {

// dir = slice direction in world space; juice sprays mostly along the cut, both ways
function juiceBurst(pos, def, dir, scale, amt = 1) {

// ---------- Juice stains on the board (2D, pre-rendered once per splat) ----------
const splats = [];
function addSplat(x, y, hex, size, dx = 0, dy = 1, def = null, mini = false) {
  size = Math.max(4, Math.min(size, 100));
  const ang = Math.atan2(dy, dx);           // spray axis = slice direction
  const S = Math.ceil(size * (mini ? 3.2 : 6.4)), C = S / 2;
  const res = Math.min(dpr, 1.25);          // keep stain bitmaps small in memory
  const off = document.createElement('canvas');
  off.width = off.height = Math.ceil(S * res);
  const g = off.getContext('2d'); g.scale(res, res);
  const seed = Math.random() * 200;

  // main pool: irregular, stretched along the spray axis, darker "dried" rim
  g.beginPath();
  const N = 56;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const n = vnoise((i % N) / N * 9, seed, 9) * 0.7 + vnoise((i % N) / N * 23, seed + 9, 23) * 0.3;
    const r = size * (0.55 + 0.45 * n) * (1 + 0.35 * Math.abs(Math.cos(a - ang)));
    const px = C + Math.cos(a) * r, py = C + Math.sin(a) * r;
    i ? g.lineTo(px, py) : g.moveTo(px, py);
  }
  g.closePath();
  const pool = g.createRadialGradient(C, C, 0, C, C, size * 1.3);
  pool.addColorStop(0, rgbaHex(hex, 0.5, 1.15)); pool.addColorStop(0.65, rgbaHex(hex, 0.68));
  pool.addColorStop(1, rgbaHex(hex, 0.9, 0.6));
  g.fillStyle = pool; g.fill();
  g.lineWidth = 1.4; g.strokeStyle = rgbaHex(hex, 0.55, 0.5); g.stroke();

  if (!mini) {
    // splash rays shooting out along the cut, each ending in a droplet
    const rays = 6 + Math.floor(rand(0, 7));
    for (let i = 0; i < rays; i++) {
      const a = ang + (Math.random() < 0.5 ? 0 : Math.PI) + rand(-0.8, 0.8);
      const r0 = size * 0.55, len = size * rand(0.5, 1.5), w = size * rand(0.05, 0.11);
      g.save(); g.translate(C, C); g.rotate(a);
      g.fillStyle = rgbaHex(hex, 0.72);
      g.beginPath(); g.moveTo(r0, -w); g.quadraticCurveTo(r0 + len * 0.6, -w * 0.3, r0 + len, 0);
      g.quadraticCurveTo(r0 + len * 0.6, w * 0.3, r0, w); g.closePath(); g.fill();
      g.beginPath(); g.arc(r0 + len + w * 0.6, 0, w * rand(0.8, 1.5), 0, Math.PI * 2); g.fill();
      g.restore();
    }
    // satellite droplets: teardrops pointing away from the impact, smaller further out
    for (let i = 0; i < 34; i++) {
      const a = Math.random() < 0.7 ? ang + (Math.random() < 0.5 ? 0 : Math.PI) + rand(-1.1, 1.1) : rand(0, Math.PI * 2);
      const dist = size * rand(1.05, 2.7);
      const r = size * rand(0.025, 0.1) * (3 - dist / size) / 2;
      if (r < 0.6) continue;
      g.save(); g.translate(C + Math.cos(a) * dist, C + Math.sin(a) * dist); g.rotate(a);
      g.fillStyle = rgbaHex(hex, rand(0.6, 0.85));
      g.beginPath(); g.ellipse(0, 0, r * 1.7, r, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
    // bits of pulp and seeds left in the puddle
    if (def) {
      for (let i = 0; i < 7; i++) {
        const a = rand(0, Math.PI * 2), d = size * rand(0, 0.5);
        g.fillStyle = rgbaHex(def.flesh, 0.55, 1.1);
        g.beginPath(); g.ellipse(C + Math.cos(a) * d, C + Math.sin(a) * d, size * rand(0.04, 0.09), size * rand(0.03, 0.06), rand(0, 3), 0, Math.PI * 2); g.fill();
      }
      if (SEED_COLOR[def.id]) for (let i = 0; i < (def.id === 'apple' ? 1 : 5); i++) {
        const a = rand(0, Math.PI * 2), d = size * rand(0.1, 0.6);
        g.fillStyle = css(SEED_COLOR[def.id]);
        g.beginPath(); g.ellipse(C + Math.cos(a) * d, C + Math.sin(a) * d, size * 0.035, size * 0.06, rand(0, 3), 0, Math.PI * 2); g.fill();
      }
    }
  }
  // wet highlight
  g.fillStyle = 'rgba(255,255,255,.22)';
  g.beginPath(); g.ellipse(C - size * 0.22, C - size * 0.28, size * (mini ? 0.25 : 0.2), size * 0.08, -0.6, 0, Math.PI * 2); g.fill();

  // juice that slowly runs down the board
  const drips = [];
  const nd = mini ? (Math.random() < 0.4 ? 1 : 0) : 1 + Math.floor(rand(0, 3));
  for (let i = 0; i < nd; i++)
    drips.push({ x: rand(-0.5, 0.5) * size, y: size * rand(0.25, 0.5), max: size * rand(0.8, 2.6), w: Math.max(1.5, size * rand(0.05, 0.09)) });

  splats.push({ x, y, t: 0, life: mini ? 4 : 5.5, img: off, S, drips, hex });
  if (splats.length > 30) splats.shift();
}

}

const FIRE_STOPS = [new THREE.Color(0xfff4c8), new THREE.Color(0xffa030), new THREE.Color(0xd8400c), new THREE.Color(0x3a1206)];
function fireColor(k, out) {

const randDir = () => new THREE.Vector3(rand(-1, 1), rand(-1, 1), rand(-0.5, 0.5)).normalize();

function spawnExplosion(pos) {
  const P = pos.clone();

      m.material.opacity = k < 0.1 ? k * 10 : 1 - k;

  // Rising smoke
  for (let i = 0; i < 18; i++) {
    const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color: 0x2b2522, depthWrite: false, transparent: true, opacity: 0 }));

    m.material.rotation = rand(0, Math.PI * 2);
    const vel = randDir().multiplyScalar(rand(0.8, 2.5)).add(new THREE.Vector3(0, 1.4, 0));

  const ring = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffe0b0, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
  ring.position.copy(P); ring.renderOrder = 3;
  addFx(ring, 0.55, (f, dt, k) => { ring.scale.setScalar(1 + 16 * (1 - Math.pow(1 - k, 3))); ring.material.opacity = 0.9 * (1 - k); });

  // Bomb shell debris
  for (let i = 0; i < 14; i++) {
    const m = new THREE.Mesh(debrisGeo, bombMat);
    m.position.copy(P); m.scale.setScalar(rand(0.5, 1.4));
    const vel = randDir().multiplyScalar(rand(7, 16)), spin = new THREE.Vector3(rand(-12, 12), rand(-12, 12), rand(-12, 12));
    addFx(m, 2.5, (f, dt) => {
      vel.y -= G * dt; m.position.addScaledVector(vel, dt);
      m.rotation.x += spin.x * dt; m.rotation.y += spin.y * dt; m.rotation.z += spin.z * dt;
    });
  }

  // Glowing embers
  for (let i = 0; i < 45; i++) {
    const m = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffb040, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    m.position.copy(P); m.renderOrder = 3;
    const vel = randDir().multiplyScalar(rand(5, 18)), s = rand(0.15, 0.4);
    addFx(m, rand(0.7, 1.6), (f, dt, k) => {

  // Blast wave pushes nearby fruit and halves away
  for (const o of [...entities.map(e => ({ p: e.mesh.position, v: e.vel })), ...halves.map(h => ({ p: h.m.position, v: h.vel }))]) {
    const d = o.p.clone().sub(P); const dist = Math.max(0.5, d.length());
    if (dist < 10) o.v.addScaledVector(d.normalize(), 18 / dist);
  }

  const sp = toScreen(P);
  addScorch(sp.x, sp.y, screenRadius(P, 3.2));
}

function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i];
    f.t += dt;
    if (f.t < 0) continue;
    f.obj.visible = true;
    const k = f.t / f.life;
    if (k >= 1) {
      scene.remove(f.obj);
      if (f.obj.material !== bombMat) f.obj.material.dispose();
      fx.splice(i, 1); continue;
    }
    f.update(f, dt, k);
  }
  fxLightPower *= Math.pow(0.004, dt);
  fxLight.intensity = fxLightPower < 1 ? 0 : fxLightPower * (0.85 + Math.random() * 0.3);
}

// ---------- Screen projection helpers ----------
const tmpV = new THREE.Vector3();
function toScreen(v3) {
  tmpV.copy(v3).project(camera);
  return { x: (tmpV.x + 1) / 2 * W, y: (1 - tmpV.y) / 2 * H };
}
function screenRadius(pos, r) {
  const a = toScreen(pos);
  const b = toScreen(tmpV.copy(pos).add(new THREE.Vector3(r, 0, 0)));
  return Math.hypot(b.x - a.x, b.y - a.y);
}
function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

let actx = null, sfxBus = null;
try {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -8; comp.ratio.value = 4;
  comp.connect(actx.destination);
  sfxBus = actx.createGain(); sfxBus.connect(comp);
} catch (e) { actx = null; }

// Decoded buffers (Web Audio). If fetch is blocked (e.g. opened via file://), fall back to <audio> elements.
const buffers = new Map(), elems = new Map();
async function loadSound(file) {
  try {
    if (!actx) throw 0;
    const res = await fetch('Sound/' + encodeURIComponent(file));
    if (!res.ok) throw 0;
    buffers.set(file, await actx.decodeAudioData(await res.arrayBuffer()));
  } catch (e) {
    const a = new Audio('Sound/' + encodeURIComponent(file));
    a.preload = 'auto';
    elems.set(file, a);
  }
}
[...new Set(Object.values(SND).flat())].forEach(loadSound);

function audio() {
  userInteracted = true; // browsers only allow audio after a user gesture
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}

// play('name') picks a random variant; play('name', {index}) picks a specific one
function play(name, { vol = 1, loop = false, index = -1, fadeIn = 0 } = {}) {
  if (!save.sound) return null;
  const list = SND[name]; if (!list) return null;
  const file = list[index >= 0 ? Math.min(index, list.length - 1) : Math.floor(Math.random() * list.length)];
  const buf = buffers.get(file);
  if (buf && actx) {
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = loop;
    const g = actx.createGain(), t = actx.currentTime;
    if (fadeIn) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + fadeIn); }
    else g.gain.value = vol;
    src.connect(g).connect(sfxBus); src.start();
    return {
      stop(fade = 0) {
        const t = actx.currentTime;
        try {
          g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t);
          g.gain.linearRampToValueAtTime(0, t + fade); src.stop(t + fade + 0.02);
        } catch (e) {}
      },
    };
  }
  const el = elems.get(file);
  if (el) {
    const a = el.cloneNode(); a.volume = Math.min(1, vol); a.loop = loop;
    a.play().catch(() => {});
    return { stop() { a.pause(); } };
  }
  return null;
}

const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
function ensureMissions() {
  if (save.missions && save.missions.date === today()) return;
  let seed = [...today()].reduce((s, ch) => (s * 31 + ch.charCodeAt(0)) >>> 0, 7);
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const pool = [...MISSION_POOL], list = [];
  while (list.length < 3) {
    const t = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    const target = t.targets[Math.floor(rnd() * t.targets.length)];
    const param = t.kind === 'sliceF' ? Object.keys(FRUIT_NAME)[Math.floor(rnd() * 6)]
      : t.kind === 'score' ? ['classic', 'zen', 'arcade'][Math.floor(rnd() * 3)] : null;
    list.push({ kind: t.kind, target, param, reward: t.reward, best: !!t.best, progress: 0, done: false });
  }
  save.missions = { date: today(), list };
  persist();
}

  { id: 'bombs20',   icon: '💣', name: 'Oops!',           desc: 'Hit 20 bombs',                reward: 30,  test: (s) => s.bombs >= 20 },

// Single entry point for every gameplay event (see track())
function onTrack(type, value, extra) {
  if (!scoring()) return;                                   // Unlock All doesn't earn progress
  if (game.mode !== 'play' && type !== 'score' && type !== 'games') return; // menu slicing doesn't count
  const s = save.stats;
  if (type === 'slice') { s.fruits += value; s.perFruit[extra] = (s.perFruit[extra] || 0) + value; }
  else if (type === 'combo') s.bestCombo = Math.max(s.bestCombo, value);
  else if (type === 'games') s.games += 1;
  else if (type === 'piece') s.pieces += 1;
  else {
    const key = { shred: 'shreds', bomb: 'bombs' }[type] || type;
    if (s[key] !== undefined && type !== 'score') s[key] += value;
  }

  ensureMissions();
  for (const m of save.missions.list) {
    if (m.done) continue;
    const match = (m.kind === type) || (m.kind === 'sliceF' && type === 'slice' && extra === m.param);
    if (!match || (m.kind === 'score' && extra !== m.param)) continue;
    m.progress = m.best ? Math.max(m.progress, value) : m.progress + value;
    if (m.progress >= m.target) {
      m.done = true; m.progress = m.target; reward(m.reward);
      toast(`📜 Mission complete! +${m.reward} 🪙`, missionText(m));
      play('mission'); buzz([20, 40, 20]);
    }
  }
  for (const a of ACHIEVEMENTS) {
    if (save.ach[a.id] || !a.test(s)) continue;
    save.ach[a.id] = Date.now(); reward(a.reward);
    toast(`${a.icon} Achievement: ${a.name}  +${a.reward} 🪙`, a.desc);
    play('achievement');
  }
  persist();
}

function spawnEntity(kind, opts = {}) {
  const isBomb = kind === 'bomb';
  const def = isBomb ? null : kind;
  const mesh = isBomb ? makeBomb(opts.variant) : makeWholeFruit(def);
  const e = {
    mesh, def, bomb: isBomb, item: opts.item || null, noMiss: false, power: opts.power || null,
    variant: isBomb ? opts.variant || null : null, golden: !isBomb && !!opts.golden,
    hp: isBomb ? 1 : def.hp || 1,
    radius: isBomb ? BOMB_R : def.extent,
    vel: new THREE.Vector3(), spin: new THREE.Vector3(rand(-3, 3), rand(-3, 3), rand(-3, 3)),
    scale: opts.scale || 1,
  };
  mesh.scale.setScalar(e.scale);
  e.radius *= e.scale;
  const glowColor = e.power ? POWERS[e.power].color : e.golden ? 0xffd040 : e.variant ? BOMB_VARIANTS[e.variant].color : null;
  if (glowColor !== null) { // glowing aura marks power-ups, golden fruit and special bombs
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: glowColor, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    halo.scale.setScalar((def ? def.extent : BOMB_R) * 3.4);
    mesh.add(halo); e.halo = halo;
  }
  if (e.golden) mesh.children[0].material = goldMat;
  if (e.item) {
    mesh.position.set(opts.x || 0, opts.y || 0, 0);
  } else {
    // launch from the bottom; patterns can override where from, where to, and how high
    const y0 = -viewH / 2 - 1.5;
    const x0 = opts.x0 ?? rand(-viewW * 0.38, viewW * 0.38);
    const peak = opts.peak ?? rand(0, viewH / 2 - 2);
    const vy = Math.sqrt(2 * G * (peak - y0));
    const tPeak = vy / G;
    const xTarget = opts.xTarget ?? rand(-viewW * 0.3, viewW * 0.3);
    mesh.position.set(x0, y0, rand(-1.5, 1.5));
    e.vel.set((xTarget - x0) / (tPeak * 1.6), vy, 0);
    play(isBomb ? 'throwBomb' : 'throwFruit', { vol: 0.45 });
  }
  scene.add(mesh);
  entities.push(e);
  return e;
}

// ---------- Menu system: fruit inside a rotating ring with a curved label ----------
const ringPlaneGeo = new THREE.PlaneGeometry(2, 2);
const ringTexCache = new Map();
function ringTexture(label, color) {
  const key = label + '|' + color;
  if (ringTexCache.has(key)) return ringTexCache.get(key);
  const S = 512, C = S / 2, OUT = 250, IN = 166, R = (OUT + IN) / 2;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d');
  const col = new THREE.Color(color);
  const rgb = (a, k = 1) => `rgba(${Math.min(255, col.r * 255 * k) | 0},${Math.min(255, col.g * 255 * k) | 0},${Math.min(255, col.b * 255 * k) | 0},${a})`;

  // translucent band with soft inner shading
  const band = g.createRadialGradient(C, C, IN, C, C, OUT);
  band.addColorStop(0, rgb(0.8, 0.55)); band.addColorStop(0.25, rgb(0.62)); band.addColorStop(0.85, rgb(0.62, 1.1)); band.addColorStop(1, rgb(0.75, 0.6));
  g.beginPath(); g.arc(C, C, OUT, 0, Math.PI * 2); g.arc(C, C, IN, 0, Math.PI * 2, true);
  g.fillStyle = band; g.fill('evenodd');
  // decorative dots
  g.fillStyle = 'rgba(255,255,255,.13)';
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2, rr = i % 2 ? OUT - 9 : IN + 9;
    g.beginPath(); g.arc(C + Math.cos(a) * rr, C + Math.sin(a) * rr, 3.5, 0, Math.PI * 2); g.fill();
  }
  g.lineWidth = 4; g.strokeStyle = rgb(0.9, 1.5);
  g.beginPath(); g.arc(C, C, OUT - 2, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(C, C, IN + 2, 0, Math.PI * 2); g.stroke();

  // curved label, written twice around the ring
  let size = 52, widths, total;
  const letters = [...label];
  do {
    g.font = `900 ${size}px "Segoe UI Black", "Arial Black", Impact, sans-serif`;
    widths = letters.map(ch => g.measureText(ch).width + size * 0.08);
    total = widths.reduce((s, w) => s + w, 0) / R;
    size -= 2;
  } while (total > Math.PI * 0.88 && size > 20);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = 7; g.strokeStyle = rgb(1, 0.35);
  g.fillStyle = rgb(1, 1.9);
  for (const start of [-Math.PI / 2, Math.PI / 2]) {
    let a = start - total / 2;
    letters.forEach((ch, i) => {
      const w = widths[i] / R; a += w / 2;
      g.save(); g.translate(C + Math.cos(a) * R, C + Math.sin(a) * R); g.rotate(a + Math.PI / 2);
      g.strokeText(ch, 0, 2); g.fillText(ch, 0, 2);
      g.restore(); a += w / 2;
    });
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  ringTexCache.set(key, t);
  return t;
}

let screen = null;

function updateMenuDom() {

function goScreen(name, delay = 380) {
  for (const o of entities) if (o.item) dropItem(o);
  if (screen && name) play('whoosh', { vol: 0.6 });
  screen = name;
  updateMenuDom();
  if (!name) return;
  setTimeout(() => {
    if (screen !== name) return;
    screenItems(name).forEach((it, i) => setTimeout(() => { if (screen === name) spawnItem(it); }, i * 90));
    play('menuAppear', { vol: 0.5 });
  }, delay);
}

function spawnItem(it) {
  const unit = Math.min(viewW / 3.3, viewH / 2.4);
  const ringR = unit * 0.5 * it.size;
  const kind = it.bomb ? 'bomb' : fruitDef(it.fruit);
  const ext = it.bomb ? 1.3 : kind.extent;
  const e = spawnEntity(kind, { item: it, scale: (ringR * 0.5) / ext, x: it.x * viewW, y: it.y * viewH });
  e.ringR = ringR; e.appear = 0; e.radius = ringR * 0.72; // generous hit area inside the ring
  e.ringDir = Math.random() < 0.5 ? 1 : -1;
  e.ring = new THREE.Mesh(ringPlaneGeo, new THREE.MeshBasicMaterial({
    map: ringTexture(it.label, it.color), transparent: true, depthWrite: false, toneMapped: false,
  }));
  e.ring.scale.setScalar(0.001);
  scene.add(e.ring);
  return e;
}

// Unselected items fall away when the screen changes
function dropItem(o) {
  clearRing(o);
  o.item = null; o.noMiss = true; o.quiet = true;
  o.vel.set(rand(-1.5, 1.5), 3, 0);
}

function selectItem(e, dx, dy) {
  const it = e.item, from = screen;
  if (e.bomb) {
    const pos = e.mesh.position.clone();
    removeEntity(e);
    spawnExplosion(pos);
    play('menuBomb');
    game.shake = 0.5;
  } else {
    sliceFruit(e, dx, dy); // juicy visuals only; no score outside a game
  }
  if (it.stay) { // e.g. toggles: run now, then the item grows back with its updated label
    it.action();
    setTimeout(() => {
      if (screen !== from) return;
      const fresh = screenItems(from).find(i => i.id === it.id);
      if (fresh) spawnItem(fresh);
    }, 650);
  } else {
    setTimeout(() => it.action(), 320);
  }
}

const easeOutBack = (x) => 1 + 2.70158 * Math.pow(x - 1, 3) + 1.70158 * Math.pow(x - 1, 2);
const hover = { x: -1e4, y: -1e4 };
addEventListener('pointermove', (ev) => { hover.x = ev.clientX; hover.y = ev.clientY; });

function updateMenuItems(dt, t) {
  let hovered = null;
  for (const e of entities) {
    if (!e.item) continue;
    const m = e.mesh, it = e.item;
    e.appear = Math.min(1, e.appear + dt / 0.45);
    const k = Math.max(0.001, easeOutBack(e.appear));
    m.position.set(it.x * viewW, it.y * viewH + Math.sin(t * 1.6 + it.x * 5) * 0.12, 0);
    m.scale.setScalar(e.scale * k);
    m.rotation.y += 0.8 * dt; m.rotation.x = Math.sin(t + it.x * 3) * 0.3;
    if (e.bomb) m.userData.spark.scale.setScalar(0.6 + Math.random() * 0.5);
    e.ring.position.set(m.position.x, m.position.y, -1.2);
    e.ring.scale.setScalar(e.ringR * k);
    e.ring.rotation.z += dt * 0.45 * e.ringDir;
    if (it.mode) {
      const sp = toScreen(m.position);
      if (Math.hypot(hover.x - sp.x, hover.y - sp.y) < screenRadius(m.position, e.ringR)) hovered = it.mode;
    }
  }
  if (screen === 'modes') {
    const keys = ['zen', 'classic', 'arcade'];
    setSign(MODE_SIGN[hovered || keys[Math.floor(t / 3.5) % 3]], 'modes');
  }
}

function paintBoard(id) {

      g.strokeStyle = dark; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len); g.stroke();
      g.strokeStyle = light; g.beginPath(); g.moveTo(x + 1.5, y + 1.5); g.lineTo(x + Math.cos(a) * len + 1.5, y + Math.sin(a) * len + 1.5); g.stroke();
    }
  };

  if (id === 'oak' || id === 'walnut') {
    const planks = 6, pw = w / planks;
    const [lo, hi] = id === 'oak' ? [[62, 34, 16], [150, 96, 54]] : [[30, 17, 9], [92, 58, 34]];
    const tones = Array.from({ length: planks }, (_, i) => 0.82 + 0.3 * NT[i * 97]);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const p = Math.floor(x / pw), lx = (x % pw) / pw, u = x / w, v = y / h;
      const warp = fbm(u, v + p * 3.1, 4, 2, 3, 20 + p);
      const grain = Math.sin((lx * 9 + warp * 5 + p * 1.7) * Math.PI * 2) * 0.5 + 0.5;
      const fine = vnoise(x * 0.7, y * 0.04 + p * 40, 256);
      const knot = Math.max(0, 1 - Math.hypot((lx - NT[p * 31]) * pw, (v - NT[p * 53]) * h) / 26);
      let col = mixC(lo, hi, Math.min(1, (grain * 0.35 + fine * 0.3 + warp * 0.35) * tones[p]));
      col = mixC(col, lo.map(q => q * 0.75), knot * 0.8);
      if (lx < 0.012 || lx > 0.988) col = col.map(q => q * 0.3); // plank gaps
      put(x, y, col);
    }
    g.putImageData(img, 0, 0);
    scratches(26, 'rgba(20,10,4,.45)', 'rgba(255,220,170,.14)');
  } else if (id === 'bamboo') {
    const rows = 8, rh = h / rows;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const r = Math.floor(y / rh), ly = (y % rh) / rh;
      const nodeX = ((x + NT[r * 13] * 400) % 190) / 190;           // knotted node every ~190px
      const node = Math.max(ss(0.04, 0, nodeX), ss(0.96, 1, nodeX));
      const shade = Math.sin(ly * Math.PI);                          // round stalk shading
      const fiber = vnoise(x * 0.03, y * 0.9 + r * 50, 256);
      let col = mixC([120, 110, 40], [214, 196, 110], shade * 0.8 + fiber * 0.2);
      col = mixC(col, [96, 82, 32], node * 0.8);
      if (ly < 0.05 || ly > 0.95) col = col.map(q => q * 0.35);     // gaps between stalks
      put(x, y, col);
    }
    g.putImageData(img, 0, 0);
  } else if (id === 'slate') {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const u = x / w, v = y / h;
      const n = fbm(u, v, 6, 4, 4, 40), vein = Math.abs(fbm(u, v, 3, 2, 3, 41) - 0.5);
      let col = mixC([46, 52, 58], [96, 104, 112], n);
      col = mixC(col, [140, 148, 156], ss(0.03, 0, vein) * 0.6);
      if (vnoise(x * 0.9, y * 0.9, 256) > 0.97) col = col.map(q => q * 1.25); // mineral sparkle
      put(x, y, col);
    }
    g.putImageData(img, 0, 0);
    scratches(18, 'rgba(10,12,14,.45)', 'rgba(220,230,240,.12)');
  } else if (id === 'steel') {
    const pw = 256, ph = 256;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const brush = vnoise(x * 0.01, y * 0.8, 256) * 0.6 + vnoise(x * 0.004, y * 0.15 + 77, 256) * 0.4; // horizontal streaks
      const px = (x % pw) / pw, py = (y % ph) / ph;
      let col = mixC([92, 98, 106], [168, 176, 186], brush * 0.8 + (1 - py) * 0.2);
      if (px < 0.008 || py < 0.008) col = col.map(q => q * 0.4);   // panel seams
      put(x, y, col);
    }
    g.putImageData(img, 0, 0);
    for (let x = 0; x <= w; x += pw) for (let y = 0; y <= h; y += ph) // rivets
      for (const [dx, dy] of [[14, 14], [pw - 14, 14], [14, ph - 14], [pw - 14, ph - 14]]) {
        const rg = g.createRadialGradient(x + dx - 2, y + dy - 2, 0, x + dx, y + dy, 7);
        rg.addColorStop(0, '#e8edf2'); rg.addColorStop(1, '#4a5058');
        g.fillStyle = rg; g.beginPath(); g.arc(x + dx, y + dy, 6, 0, Math.PI * 2); g.fill();
      }
    scratches(30, 'rgba(30,34,40,.35)', 'rgba(255,255,255,.18)');
  }
  return c.toDataURL('image/jpeg', 0.9);
}
const boardCache = new Map();
const isBoard = (id) => BOARDS.some(b => b.id === id);
// unknown ids fall back to oak: painting an unknown id would leave a blank canvas, which encodes as a black JPEG
const boardImage = (id) => { if (!isBoard(id)) id = 'oak'; if (!boardCache.has(id)) boardCache.set(id, paintBoard(id)); return boardCache.get(id); };
const hasBoard = (id) => isBoard(id) && (save.unlockAll || id === 'oak' || (save.boards || []).includes(id));
const currentBoard = () => (hasBoard(save.board) ? save.board : 'oak');
function applyBoard() {
  const id = currentBoard();
  try { $('bg').style.background = `radial-gradient(ellipse at center, rgba(0,0,0,0) 35%, rgba(0,0,0,.6) 100%), url(${boardImage(id)}) center / cover`; } catch (e) {}
}
applyBoard();

function sliceFruit(e, dx, dy) {
  removeEntity(e);
  const def = e.def, pos = e.mesh.position;
  const d = new THREE.Vector3(dx, -dy, 0).normalize();
  const n = new THREE.Vector3(-d.y, d.x, 0);
  // Keep the fruit's long axis as it was, and cut along a plane containing that axis
  const fruitAxis = new THREE.Vector3(0, 1, 0).applyQuaternion(e.mesh.quaternion);
  const origin = { eighthCuts: 0, t: performance.now(), shredded: false };
  for (const s of [1, -1]) {
    const h = makeHalf(def, s === 1);
    h.position.copy(pos).addScaledVector(n, s * 0.1 * e.scale);
    h.scale.setScalar(e.scale);
    // local +X = outward (skin side); tilt so the juicy cut face turns toward the camera
    const xAx = n.clone().multiplyScalar(s).add(new THREE.Vector3(0, 0, -0.45)).normalize();
    const yAx = fruitAxis.clone().addScaledVector(xAx, -fruitAxis.dot(xAx));
    if (yAx.lengthSq() < 1e-4) yAx.copy(d);
    yAx.normalize();
    const zAx = new THREE.Vector3().crossVectors(xAx, yAx);
    h.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAx, yAx, zAx));
    scene.add(h);
    halves.push({
      m: h,
      vel: e.vel.clone().multiplyScalar(0.5).addScaledVector(n, s * 3.5).add(new THREE.Vector3(0, 1.5, 0)),
      axis: d.clone().add(new THREE.Vector3(0, 0, rand(-0.3, 0.3))).normalize(),
      spinSpeed: s * rand(2, 5),
      juice: def.juice, scale: e.scale, drips: 14, dripT: rand(0, 0.05), // keeps leaking juice as it falls
      def, phiStart: 0, phiLen: Math.PI, age: 0, // can be sliced again into smaller pieces
      origin, // shared by every piece of this fruit, to detect a full "shred"
    });
  }
  juiceBurst(pos, def, d, e.scale);
  burst(pos, knife().sparks, 10, 12, 0.09);
  const sp = toScreen(pos);
  addSplat(sp.x, sp.y, def.juice, screenRadius(pos, e.radius) * 0.9, dx, dy, def);
  knifeImpact(sp.x, sp.y, dx, dy, screenRadius(pos, e.radius));
  sfx.slice(def);
  buzz(12);

  if (game.mode !== 'play') return;
  addPoints(1);
  track('slice', 1, def.id);
  if (e.golden) {
    burst(pos, [0xffd040, 0xfff2a0, 0xffffff], 30, 14, 0.12);
    const bonus = addPoints(10);
    popup(bonus ? `GOLDEN! +${bonus}` : 'GOLDEN!', sp.x, sp.y - 40, 'combo');
    play('golden'); buzz([15, 25, 15]);
    track('golden');
  }
  if (def.hp) track('hard');
  if (e.power) activatePower(e.power, sp);
  const c = game.combo;
  c.count++; c.last = game.elapsed; c.x = sp.x; c.y = sp.y;
  updateHud();
}

function activatePower(p, sp) {
  game[p] = POWERS[p].dur;
  if (p === 'frenzy') game.frenzyTimer = 0;
  popup(POWERS[p].label, sp.x, sp.y - 40, 'combo');
  play(p);
}

// Smoke / mirror bombs: a soft "poof" instead of a blast, plus a temporary handicap
function variantBomb(e) {
  removeEntity(e);
  const pos = e.mesh.position.clone(), V = BOMB_VARIANTS[e.variant];
  for (let i = 0; i < 16; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color: V.color, transparent: true, depthWrite: false, opacity: 0 }));
    s.position.copy(pos).addScaledVector(randDir(), rand(0, 0.6));
    const v = randDir().multiplyScalar(rand(1.5, 5)), s0 = rand(0.8, 1.4), s1 = rand(3, 5.5);
    addFx(s, rand(0.7, 1.2), (f, dt, k) => {
      v.multiplyScalar(Math.pow(0.2, dt)); s.position.addScaledVector(v, dt);
      s.scale.setScalar(s0 + (s1 - s0) * Math.sqrt(k)); s.material.opacity = 0.8 * (1 - k);
    });
  }
  burst(pos, [V.spark, 0xffffff], 20, 10, 0.1);
  const sp = toScreen(pos);
  popup(V.label, sp.x, sp.y, 'miss');
  buzz([50, 30, 50]);
  game.shake = Math.max(game.shake, 0.4);
  if (e.variant === 'smoke') { game.smoke = 3.5; play('smokeBomb'); }
  else { game.mirror = 4; play('mirrorBomb'); pointerDown = false; last = null; }
  track('bomb');
}

function explodeBomb(e) {
  if (e.variant) return variantBomb(e);
  removeEntity(e);
  const pos = e.mesh.position;
  spawnExplosion(pos);
  track('bomb');
  sfx.boom();

  game.shake = penalty ? 1.0 : 1.4;
  game.slowmo = penalty ? 0.4 : 0.7; // brief slow motion for everything except the blast itself
  if (penalty && scoring()) { // Arcade: bombs cost points instead of ending the game
    game.score = Math.max(0, game.score - 10);
    const sp = toScreen(pos);
    popup('-10', sp.x, sp.y, 'miss');
    updateHud();
  }
  const flash = $('flash');
  flash.style.background = 'radial-gradient(circle, #fffbe8 0%, #ffd27a 45%, #ff8a2a 100%)';
  flash.style.transition = 'none'; flash.style.opacity = '0.9';

  if (game.mode === 'play' && game.type === 'classic') { game.mode = 'dying'; setTimeout(gameOver, 1600); }
}

function trySlice(ax, ay, bx, by) {
  if (Math.hypot(bx - ax, by - ay) < 3) return;
  for (const e of [...entities]) {
    const sp = toScreen(e.mesh.position);
    const r = screenRadius(e.mesh.position, e.radius);
    if (distToSegment(sp.x, sp.y, ax, ay, bx, by) < r) {
      if (e.item) { if (e.appear > 0.6 && !shopOpen && !progressOpen) selectItem(e, bx - ax, by - ay); }
      else if (e.bomb) explodeBomb(e);
      else if (e.hp > 1 || performance.now() - (e.lastHit || 0) < 160) hitHardFruit(e, bx - ax, by - ay);
      else sliceFruit(e, bx - ax, by - ay);
    }
  }
  // pieces of fruit that were already cut can be cut again, down to eighths
  for (const h of [...halves]) {
    if (h.age < 0.12 || h.phiLen < MIN_PIECE) continue; // fresh pieces can't be re-hit in the same instant
    const c = pieceCenter(h), sp = toScreen(c);
    if (distToSegment(sp.x, sp.y, ax, ay, bx, by) < screenRadius(c, pieceRadius(h))) slicePiece(h, bx - ax, by - ay);
  }
}

// Hard fruit (coconut): each hit cracks it and bumps it back up, the last hit splits it
function hitHardFruit(e, dx, dy) {
  const now = performance.now();
  if (now - (e.lastHit || 0) < 160) return; // one hit per swipe pass
  e.lastHit = now;
  e.hp--;
  const body = e.mesh.children[0];
  if (!e.golden && e.def.crackMats) body.material = e.def.crackMats[e.def.hp - e.hp];
  const swipe = new THREE.Vector3(dx, -dy, 0).normalize();
  e.vel.addScaledVector(swipe, 3); e.vel.y = Math.max(e.vel.y, 5);
  e.spin.multiplyScalar(1.6);
  const pos = e.mesh.position;
  // husk chips fly off
  for (let i = 0; i < 9; i++) {
    const m = new THREE.Mesh(pulpGeo, pulpMat(i % 3 ? 0x4a2d17 : 0x8a6038));
    m.position.copy(pos).addScaledVector(randDir(), e.radius * 0.8);
    addPart(m, randDir().multiplyScalar(rand(3, 7)).add(new THREE.Vector3(0, 2, 0)), rand(0.6, 1), rand(0.05, 0.1) * e.scale, 'chunk',
      { spin: new THREE.Vector3(rand(-14, 14), rand(-14, 14), rand(-14, 14)) });
  }
  const sp = toScreen(pos);
  knifeImpact(sp.x, sp.y, dx, dy, screenRadius(pos, e.radius) * 0.6);
  popup(e.hp === 1 ? 'CRACK!!' : 'CRACK!', sp.x, sp.y - 30, 'piece');
  play('hardHit'); buzz(25);
  game.shake = Math.max(game.shake, 0.25);
}

const MIN_PIECE = Math.PI / 4 + 1e-3; // halves -> quarters -> eighths
// world-space center of a wedge (its mass sits away from the fruit axis)
function pieceCenter(h) {
  const mid = h.phiStart + h.phiLen / 2, rr = h.def.r * (0.25 + 0.2 * (h.phiLen / Math.PI));
  h.m.updateMatrixWorld();
  return new THREE.Vector3(Math.sin(mid) * rr, 0, Math.cos(mid) * rr).applyMatrix4(h.m.matrixWorld);
}
const pieceRadius = (h) => h.def.extent * h.scale * (0.5 + 0.4 * h.phiLen / Math.PI);

function slicePiece(h, dx, dy) {
  const idx = halves.indexOf(h); if (idx < 0) return;
  const c = pieceCenter(h);
  halves.splice(idx, 1); scene.remove(h.m);
  const half = h.phiLen / 2, mid = h.phiStart + half;
  // new cut plane goes through the fruit axis at the wedge's middle angle
  const nWorld = new THREE.Vector3(Math.cos(mid), 0, -Math.sin(mid)).transformDirection(h.m.matrixWorld);
  const swipe = new THREE.Vector3(dx, -dy, 0).normalize();
  for (const [start, s] of [[h.phiStart, -1], [mid, 1]]) {
    const p = makePiece(h.def, start, half, false);
    p.position.copy(h.m.position); p.quaternion.copy(h.m.quaternion); p.scale.copy(h.m.scale);
    scene.add(p);
    halves.push({
      m: p, def: h.def, phiStart: start, phiLen: half, age: 0,
      vel: h.vel.clone().multiplyScalar(0.6).addScaledVector(nWorld, s * 3.2).addScaledVector(swipe, 2.5).add(new THREE.Vector3(0, 2.5, 0)),
      axis: randDir(), spinSpeed: rand(-8, 8),
      juice: h.juice, scale: h.scale, drips: 6, dripT: rand(0, 0.05), origin: h.origin,
    });
  }
  // smaller juicy burst than the first cut
  juiceBurst(c, h.def, swipe, h.scale * 0.75, 0.45);
  const sp = toScreen(c), r = screenRadius(c, pieceRadius(h));
  addSplat(sp.x, sp.y, h.def.juice, r * 0.55, dx, dy, h.def);
  knifeImpact(sp.x, sp.y, dx, dy, r * 0.7);
  sfx.slice(h.def);
  buzz(8);
  track('piece');

  // Bonus: +1 per extra cut, and a big bonus for shredding one fruit into all 8 pieces quickly
  const pts = addPoints(1);
  if (pts) popup('+' + pts, sp.x, sp.y - 20, 'piece');
  const o = h.origin;
  if (o && half < MIN_PIECE && ++o.eighthCuts === 4 && !o.shredded) {
    o.shredded = true;
    if (performance.now() - o.t < 4000) {
      const bonus = addPoints(5);
      popup(bonus ? `SHREDDED! +${bonus}` : 'SHREDDED!', sp.x, sp.y - 50, 'combo');
      play('shred'); buzz([20, 30, 40]);
      track('shred');
    }
  }
  if (pts) updateHud();
}

function startGame(type) {
  game.type = type;
  game.mode = 'play'; game.score = 0; game.lives = 3; game.elapsed = 0;
  game.spawnTimer = 0.6; game.queue = []; game.combo.count = 0;

function gameOver() {

    : `${MODES[game.type].name}  •  🔓 Unlock All is on: score disabled`;
